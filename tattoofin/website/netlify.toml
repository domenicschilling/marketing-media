# Netlify-Projekt „Tattoofin“ (Basisverzeichnis beim Verknüpfen: tattoofin/website)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# App-Seiten nicht in Suchmaschinen
[[headers]]
  for = "/portal.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/aufsteller.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-10b.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/zahlen/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/einrichtung-anleitung.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Caching
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Vorschau-Adresse und www auf die Hauptdomain (doppelte Inhalte vermeiden)
[[redirects]]
  from = "https://tattoofin-start.netlify.app/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.tattoofin.de/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
# Eigene Zahlseite je Studio: tattoofin.de/zahlen/<studio> (Ziel des QR-Codes auf dem Holz-Aufsteller).
# Die alte Adresse /zahlen.html?s=<studio> funktioniert weiter.
[[redirects]]
  from = "/zahlen/*"
  to = "/zahlen.html"
  status = 200
# Kurzlink für den Instagram-Lead-Magnet („ANZAHLUNG“)
[[redirects]]
  from = "/anzahlung"
  to = "/muster-anzahlungsbedingungen.pdf"
  status = 302
