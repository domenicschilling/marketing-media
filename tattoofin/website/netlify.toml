# Netlify-Projekt „Tattoofin“ (Basisverzeichnis beim Verknüpfen: tattoofin/website)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# App-Seiten nicht in Suchmaschinen
[[headers]]
  for = "/portal.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/bestaetigung.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/nachweis.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-10b.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/zahlen/*"
  [headers.values]
    X-Robots-Tag = "noindex"
# Web-App (PWA): Service Worker und Manifest nie lange zwischenspeichern
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/aufsteller.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/einrichtung-anleitung.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Caching
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/css/fonts-stripe.css"
  [headers.values]
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Vorschau-Adresse und www auf die Hauptdomain (doppelte Inhalte vermeiden)
[[redirects]]
  from = "https://tattoofin-start.netlify.app/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.tattoofin.de/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
# Kurzlink für den Instagram-Lead-Magnet („ANZAHLUNG“)
[[redirects]]
  from = "/anzahlung"
  to = "/muster-anzahlungsbedingungen.pdf"
  status = 302

# Eigene Zahlseite je Studio: tattoofin.de/zahlen/<studio> (alte Adresse /zahlen.html?s=… funktioniert weiter)
[[redirects]]
  from = "/zahlen/*"
  to = "/zahlen.html"
  status = 200
# Studio-Dashboard (Web-App)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
