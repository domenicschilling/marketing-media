# Netlify-Projekt „Ted am Telefon“ (Basisverzeichnis beim Verknüpfen: telefon/website)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/portal.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
