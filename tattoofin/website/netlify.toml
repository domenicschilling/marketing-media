# Netlify-Projekt „Tattoofin“ (Basisverzeichnis beim Verknüpfen: tattoofin/website)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# App-Seiten nicht in Suchmaschinen
[[headers]]
  for = "/portal.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/app-fertig.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/bestaetigung.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/nachweis.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-10b.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-10c.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-10d.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-12.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-12b.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-12c.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-12d.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/vertrag-2026-12e.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/druck/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/gutschein-kaufen/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/zahlen/*"
  [headers.values]
    X-Robots-Tag = "noindex"
# Web-App (PWA): Service Worker und Manifest nie lange zwischenspeichern
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/gutschein.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"
# Admin-App „TF Admin“ (Homescreen): Manifest und Icons nicht in Suchmaschinen
[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/assets/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/css/admin.css"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/js/admin.js"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/einrichtung-anleitung.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Caching
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/css/fonts-stripe.css"
  [headers.values]
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Vorschau-Adresse und www auf die Hauptdomain (doppelte Inhalte vermeiden)
[[redirects]]
  from = "https://tattoofin-start.netlify.app/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.tattoofin.de/*"
  to = "https://tattoofin.de/:splat"
  status = 301
  force = true
# Alter Ratgeber „Klarna im Tattoostudio“ = gleiche Frage wie /funktionen/ratenzahlung/ (Search Console 90 Tage bis 18.11.2026: 0 Treffer) → eine Seite
[[redirects]]
  from = "/klarna-tattoostudio.html"
  to = "/funktionen/ratenzahlung/"
  status = 301
  force = true
[[redirects]]
  from = "/klarna-tattoostudio"
  to = "/funktionen/ratenzahlung/"
  status = 301
  force = true
# Kurzlink für den Instagram-Lead-Magnet („ANZAHLUNG“)
[[redirects]]
  from = "/anzahlung"
  to = "/muster-anzahlungsbedingungen.pdf"
  status = 302

# Endkunden-Seite (19.10.2026): /fuer-kunden ist ein zweiter Name für /raten
[[redirects]]
  from = "/fuer-kunden"
  to = "/raten"
  status = 301
# Eigene Zahlseite je Studio: tattoofin.de/zahlen/<studio> (alte Adresse /zahlen.html?s=… funktioniert weiter)
[[redirects]]
  from = "/zahlen/*"
  to = "/zahlen.html"
  status = 200
# Gutschein-Shop (23.11.2026, Tattoo Fashion München + Landshut, siehe netlify/functions/_lib/gutschein-shop.mjs): statische Seiten je Stadt
# public/gutschein-kaufen/<slug>.html (dev/gutschein-seiten.mjs), Netlify liefert /gutschein-kaufen/<slug> direkt aus, unbekannte → 404.
# Alte Adressen der ersten Fassung leiten weiter.
[[redirects]]
  from = "/gutschein-kaufen.html"
  query = {s = ":s"}
  to = "/gutschein-kaufen/:s"
  status = 301
[[redirects]]
  from = "/gutschein-kaufen.html"
  to = "/gutschein-kaufen/tattoo-fashion-munich"
  status = 301
[[redirects]]
  from = "/gutschein-kaufen-datenschutz.html"
  to = "/gutschein-kaufen/tattoo-fashion-munich-datenschutz"
  status = 301
# Studio-Dashboard (Web-App)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
# Produktvideo (/video): Dateien ändern sich nicht, neue Fassung = neuer Dateiname
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
