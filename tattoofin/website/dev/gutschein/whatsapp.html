<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Nachbau der WhatsApp-Linkvorschau (dunkles Design): große Vorschau und kleines Quadrat aus der Bildmitte. Nur zum Prüfen, wird nicht ausgeliefert. --><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b141a;font:15px/1.3 -apple-system,system-ui,sans-serif;color:#e9edef;padding:16px;width:760px}
.row{display:flex;gap:24px;align-items:flex-start}
.lab{font:12px sans-serif;color:#8696a0;margin:0 0 6px}
.bubble{background:#005c4b;border-radius:10px;padding:4px;width:330px}
.prev{background:#025144;border-radius:7px;overflow:hidden}
.big img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover}
.txt{padding:8px 10px}
.t{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:13.5px;color:#cfd9d4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u{font-size:12.5px;color:#9fb8b0;margin-top:4px}
.small{display:flex}
.small img{width:96px;height:96px;object-fit:cover;flex:none}
.msg{padding:6px 8px 4px;font-size:15px;color:#e9edef}
.msg a{color:#53bdeb}
</style></head><body>
<div class="row">
<div><p class="lab">Große Vorschau</p><div class="bubble"><div class="prev big"><img src="{{ogDatei}}"><div class="txt"><div class="t">{{ogTitel}}</div><div class="d">{{ogText}}</div><div class="u">{{domain}}</div></div></div><div class="msg"><a>{{seitenUrl}}</a></div></div></div>
<div><p class="lab">Kleine Vorschau (Quadrat aus der Mitte)</p><div class="bubble"><div class="prev small"><img src="{{ogDatei}}"><div class="txt"><div class="t">{{ogTitel}}</div><div class="d">{{ogText}}</div><div class="u">{{domain}}</div></div></div><div class="msg"><a>{{seitenUrl}}</a></div></div></div>
</div></body></html>
