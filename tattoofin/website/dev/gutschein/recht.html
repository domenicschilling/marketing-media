<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Erzeugt von dev/gutschein-seiten.mjs aus dev/gutschein/recht.html – nicht von Hand ändern -->
<title>{{seitenTitel}} · Gutschein-Shop · {{name}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/assets/gs-shop/{{kuerzel}}/favicon.png">
<style>
@font-face{font-family:"Oswald";font-weight:500 700;font-display:swap;src:url(/assets/gs-shop/schrift/oswald-latin.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400 700;font-display:swap;src:url(/assets/gs-shop/schrift/inter-latin.woff2) format("woff2")}
*{box-sizing:border-box}
body{margin:0;background:#0B0B0B;color:#F4EFE6;font:16px/1.6 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:24px 20px 80px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid rgba(200,163,90,.25)}
.kopf img{height:48px;width:auto;display:block}
.kopf a{color:#E8CD92;font-weight:600;text-decoration:none;padding:10px 0}
h1{font:700 clamp(30px,8vw,40px)/1.05 "Oswald",system-ui,sans-serif;text-transform:uppercase;margin:28px 0 14px;background:linear-gradient(180deg,#F6E7C3 0%,#E8CD92 40%,#C8A35A 75%,#A9843F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 19px "Oswald",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:28px 0 6px;color:#E8CD92}
p,li{color:#C9C1B2;margin:10px 0}
ul,ol{padding-left:20px}
a{color:#E8CD92}
.kasten{background:#141311;border:1px solid rgba(200,163,90,.25);border-radius:16px;padding:16px 18px;margin-top:18px}
nav.fuss{margin-top:40px;padding-top:18px;border-top:1px solid rgba(200,163,90,.25);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
nav.fuss a{color:#B3AB9C;padding:6px 0}
nav.fuss a[aria-current]{color:#E8CD92}
</style>
</head>
<body>
<main>
<div class="kopf"><a href="/gutschein-kaufen/{{slug}}" aria-label="Zurück zu den Gutscheinen von {{name}}"><img src="/assets/gs-shop/{{kuerzel}}/logo.png" alt="{{name}}" width="88" height="48"></a><a href="/gutschein-kaufen/{{slug}}">← Zu den Gutscheinen</a></div>
<h1>{{seitenTitel}}</h1>
{{{inhalt}}}
<nav class="fuss" aria-label="Rechtliches">{{{fussLinks}}}</nav>
</main>
</body>
</html>
