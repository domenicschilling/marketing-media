<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Vorschaubild (og:image) 1200×630 je Stadt, gerendert von dev/gutschein-seiten.mjs --og. Die Mitte (Quadrat 630×630) muss allein
     funktionieren: WhatsApp zeigt oft nur ein kleines Quadrat aus der Mitte. Kein Text unter 30 px (in WhatsApp ist das Bild ~320 px breit).
     Links das Geschenk (Gutschein mit Schleife, wie im Hero, ganz im Bild), rechts eine Karte mit drei Zeilen.
     24.11.2026 (Runde 3): Logo 1,6-mal größer (290 px), Karten ruhiger (weniger schräg) und ganz im Bild. Jeder Text wird gemessen und
     verkleinert, bis er passt: Überschrift höchstens 540 px (Quadrat-Rand ≥ 45 px), Kartentext mit mindestens 24 px Rand links und rechts
     (sonst wurde „als PDF“ abgeschnitten). Alles in Großbuchstaben (Oswald). Die Goldzeilen haben oben Luft, sonst schneidet der
     Gold-Verlauf (background-clip:text) die Punkte über dem Ü ab. Drei Fassungen: „angebot“ (500 € für 375 €), „neutral“ (ohne Beträge,
     wenn der 500er oder der günstigste ausverkauft ist), „danach“ (nach dem 24.12., 16 Uhr oder wenn alles verkauft ist).
     24.11.2026 abends (Domenic): „Für 375 € kaufen, / 500 € bekommen*“ (bezahlter Betrag zuerst, Wert gold und größer), Pille
     „Tattoo-Gutschein“, Karte „Für 200 € / 300 € / bekommen“, unten die Bedingung zum Sternchen (einzige Zeile unter 30 px, sie ist der
     Pflicht-Hinweis, kein Werbetext; nur in der Fassung „angebot“). --><style>
@font-face{font-family:"Oswald";font-weight:500 700;src:url({{assets}}/schrift/oswald-latin.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400 700;src:url({{assets}}/schrift/inter-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0B0B0B}
#og{position:relative;width:1200px;height:630px;overflow:hidden;color:#F4EFE6;font-family:Inter,sans-serif;
 background:radial-gradient(40% 58% at 50% 46%,rgba(200,163,90,.24),rgba(11,11,11,0) 72%),radial-gradient(120% 90% at 50% 0%,#1d170d,#0B0B0B 72%)}
.rahmen{position:absolute;inset:14px;border:1.5px solid rgba(200,163,90,.42);border-radius:22px}
.zw{position:absolute;top:0;width:250px;height:auto;color:#C8A35A;opacity:.7}
.zw.l{left:0}.zw.r{right:0;transform:scaleX(-1)}
.stern{position:absolute;color:#E8CD92}
.stern svg{display:block;width:100%;height:100%}
.mitte{position:absolute;left:285px;width:630px;top:0;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:6px}
.logo{width:290px;height:auto;margin-bottom:8px}
.aktion{display:inline-block;font:600 32px/1 Oswald;letter-spacing:.14em;text-transform:uppercase;color:#F6E7C3;border:2px solid #d9b46e;border-radius:999px;padding:10px 26px 9px;
 background:linear-gradient(180deg,#a3222f,#6d1119);box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
h1{margin-top:12px;font-family:Oswald;font-weight:700;text-transform:uppercase;line-height:1}
h1 span{display:block;width:max-content;margin:0 auto;white-space:nowrap}
h1 .a{font-size:76px;color:#F4EFE6}
h1.kaufen .a{font-size:62px}
h1 .b{font-size:108px;line-height:1.12;padding-top:.12em;margin-top:-.08em}
.g{background:linear-gradient(180deg,#F6E7C3 0%,#E8CD92 40%,#C8A35A 75%,#A9843F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bis{margin-top:6px;font:700 40px/1 Oswald;letter-spacing:.04em;text-transform:uppercase;color:#0B0B0B;background:linear-gradient(180deg,#E8CD92,#C8A35A);border-radius:999px;padding:12px 30px 11px;white-space:nowrap}
.geschenk{position:absolute;left:30px;top:335px;width:224px;transform:rotate(-6deg);filter:drop-shadow(0 16px 26px rgba(0,0,0,.65))}
.karte{position:absolute;left:960px;top:250px;width:200px;height:240px;border-radius:22px;border:2px solid rgba(214,180,112,.75);background:linear-gradient(145deg,#241d13,#0f0e0c);
 box-shadow:0 22px 44px rgba(0,0,0,.6);transform:rotate(5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding-top:34px}
.karte:before{content:"";position:absolute;left:0;right:0;top:24px;height:26px;background:linear-gradient(180deg,#4c0b13,#a3222f 50%,#4c0b13);border-top:1.5px solid #d9b46e;border-bottom:1.5px solid #d9b46e}
.karte span{display:block;white-space:nowrap;text-transform:uppercase}
.karte .ab{font:600 32px/1 Oswald;letter-spacing:.1em;color:#E8CD92}
.karte .p{font:700 76px/1.12 Oswald;margin:2px 0 4px;padding-top:.08em}
.karte .w{font:600 30px/1 Oswald;letter-spacing:.04em;color:#F4EFE6}
.fuss{position:absolute;left:40px;right:40px;bottom:26px;text-align:center;font:500 20px/1.2 Inter,sans-serif;color:#C9C0AE;white-space:nowrap}
.fuss:empty{display:none}
</style></head><body><div id="og">
<div class="rahmen"></div>
{{{zweigL}}}{{{zweigR}}}
<div id="sterne"></div>
<img class="geschenk" src="{{geschenk}}" alt="">
<div class="karte"><span class="ab">{{karteOben}}</span><span class="p g">{{karteMitte}}</span><span class="w">{{karteUnten}}</span></div>
<div class="mitte">
 <img class="logo" src="{{assets}}/{{kuerzel}}/logo-gold-960.webp" alt="">
 <span class="aktion">{{pille}}</span>
 <h1 class="{{h1Klasse}}"><span class="a">{{zeileA}}</span><span class="b g">{{zeileB}}</span></h1>
 <span class="bis">{{bis}}</span>
</div>
<div class="fuss">{{fuss}}</div>
</div>
<script>var F='<svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">'+[0,60,120,180,240,300].map(function(r){return '<g transform="rotate('+r+')"><path d="M0 0V-11M0-7.5l-2.6-2.6M0-7.5l2.6-2.6M0-3.8l-1.8-1.8M0-3.8l1.8-1.8"/></g>'}).join("")+'</svg>';
// Jeden Text messen und verkleinern, bis er passt: Überschrift ≤ 540 px, Pillen ≤ 560 px, Kartentext ≤ Kartenbreite − 2 × 24 px
// (gemessen ohne Drehung über offsetWidth). window.passt meldet dem Skript, ob alles passt (prüft dev/gutschein-seiten.mjs).
window.fertig=document.fonts.ready.then(function(){
 var karte=document.querySelector(".karte"),innen=karte.clientWidth-48,ok=true;
 [].forEach.call(document.querySelectorAll("h1 span,.bis,.aktion,.karte span"),function(e){
  var max=e.closest(".karte")?innen:e.classList.contains("bis")||e.classList.contains("aktion")?560:540,f=parseFloat(getComputedStyle(e).fontSize);
  while(e.offsetWidth>max&&f>24){f-=1;e.style.fontSize=f+"px"}
  if(e.offsetWidth>max)ok=false;
 });
 // Bedingung zum Sternchen: eine Zeile innerhalb des Rahmens
 var fu=document.querySelector(".fuss");if(fu.textContent&&fu.scrollWidth>fu.clientWidth)ok=false;
 // Kartentext auch in der Höhe: Zeilen zusammen höchstens Kartenhöhe − Band − 20 px
 var hoehe=[].reduce.call(karte.querySelectorAll("span"),function(s,e){return s+e.offsetHeight},0);
 if(hoehe>karte.clientHeight-34-20)ok=false;
 window.passt={ok:ok,innen:innen,hoehe:hoehe,spans:[].map.call(document.querySelectorAll(".karte span,h1 span"),function(e){return {t:e.textContent,b:e.offsetWidth}})};
});
document.getElementById("sterne").innerHTML=[[240,150,22,.4],[60,236,18,.32],[1150,170,22,.4],[930,96,18,.3],[1090,580,22,.36],[246,560,20,.3],[150,140,16,.3]].map(function(a){return '<span class="stern" style="left:'+a[0]+'px;top:'+a[1]+'px;width:'+a[2]+'px;height:'+a[2]+'px;opacity:'+a[3]+'">'+F+'</span>'}).join("")</script>
</body></html>
