<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Vorschaubild (og:image) 1200×630 je Stadt, gerendert von dev/gutschein-seiten.mjs --og. Die Mitte (Quadrat 630×630) muss allein
     funktionieren: WhatsApp zeigt oft nur ein kleines Quadrat aus der Mitte. Kein Text unter 34 px (in WhatsApp ist das Bild ~330 px breit).
     Links das Geschenk (Gutschein mit Schleife, wie im Hero), rechts der günstigste Aktions-Gutschein.
     24.11.2026: Für das Quadrat links und rechts mindestens 45 px Rand (Überschrift höchstens 540 px breit), Seitenteile mindestens
     20 px außerhalb von x 285–915, Logo kleiner, Datums-Pille größer (44 px). Die Goldzeile hat oben Luft, sonst schneidet der
     Gold-Verlauf (background-clip:text) die Punkte über dem Ü ab. Zwei Fassungen: „angebot“ (500 € für 375 €) und „neutral“
     (ohne Beträge, für die Zeit, wenn der beworbene Gutschein ausverkauft ist). --><style>
@font-face{font-family:"Oswald";font-weight:500 700;src:url({{assets}}/schrift/oswald-latin.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400 700;src:url({{assets}}/schrift/inter-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0B0B0B}
#og{position:relative;width:1200px;height:630px;overflow:hidden;color:#F4EFE6;font-family:Inter,sans-serif;
 background:radial-gradient(40% 58% at 50% 46%,rgba(200,163,90,.24),rgba(11,11,11,0) 72%),radial-gradient(120% 90% at 50% 0%,#1d170d,#0B0B0B 72%)}
.rahmen{position:absolute;inset:14px;border:1.5px solid rgba(200,163,90,.42);border-radius:22px}
.zw{position:absolute;top:0;width:250px;height:auto;color:#C8A35A;opacity:.7}
.zw.l{left:0}.zw.r{right:0;transform:scaleX(-1)}
.stern{position:absolute;color:#E8CD92}
.stern svg{display:block;width:100%;height:100%}
.mitte{position:absolute;left:285px;width:630px;top:0;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:177px;height:auto;margin-bottom:10px}
.aktion{display:inline-block;font:600 34px/1 Oswald;letter-spacing:.14em;text-transform:uppercase;color:#F6E7C3;border:2px solid #d9b46e;border-radius:999px;padding:11px 26px 10px;
 background:linear-gradient(180deg,#a3222f,#6d1119);box-shadow:0 8px 24px rgba(0,0,0,.45)}
h1{margin-top:12px;font-family:Oswald;font-weight:700;text-transform:uppercase;line-height:1}
h1 span{display:block;width:max-content;margin:0 auto;white-space:nowrap}
h1 .a{font-size:84px;color:#F4EFE6}
h1 .b{font-size:120px;line-height:1.12;padding-top:.12em;margin-top:-.06em}
.g{background:linear-gradient(180deg,#F6E7C3 0%,#E8CD92 40%,#C8A35A 75%,#A9843F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bis{margin-top:8px;font:700 44px/1 Oswald;letter-spacing:.04em;text-transform:uppercase;color:#0B0B0B;background:linear-gradient(180deg,#E8CD92,#C8A35A);border-radius:999px;padding:13px 30px 12px;white-space:nowrap}
.geschenk{position:absolute;left:-20px;top:330px;width:270px;transform:rotate(-8deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.karte{position:absolute;left:962px;top:262px;width:206px;height:250px;border-radius:22px;border:2px solid rgba(214,180,112,.75);background:linear-gradient(145deg,#241d13,#0f0e0c);
 box-shadow:0 24px 50px rgba(0,0,0,.6);transform:rotate(7deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.karte:before{content:"";position:absolute;left:0;right:0;top:26px;height:30px;background:linear-gradient(180deg,#4c0b13,#a3222f 50%,#4c0b13);border-top:1.5px solid #d9b46e;border-bottom:1.5px solid #d9b46e}
.karte .ab{margin-top:40px;font:600 38px/1 Oswald;letter-spacing:.12em;text-transform:uppercase;color:#E8CD92}
.karte .p{font:700 78px/1.1 Oswald;white-space:nowrap;margin:2px 0 8px;padding-top:.04em}
.karte .w{font:600 34px/1 Oswald;letter-spacing:.04em;text-transform:uppercase;color:#F4EFE6;white-space:nowrap}
</style></head><body><div id="og">
<div class="rahmen"></div>
{{{zweigL}}}{{{zweigR}}}
<div id="sterne"></div>
<img class="geschenk" src="{{geschenk}}" alt="">
<div class="karte"><span class="ab">{{karteOben}}</span><span class="p g">{{karteMitte}}</span><span class="w">{{karteUnten}}</span></div>
<div class="mitte">
 <img class="logo" src="{{assets}}/{{kuerzel}}/logo-gold-960.webp" alt="">
 <span class="aktion">Weihnachts-Aktion</span>
 <h1><span class="a">{{zeileA}}</span><span class="b g">{{zeileB}}</span></h1>
 <span class="bis">Nur bis 24.12., 16 Uhr</span>
</div>
</div>
<script>var F='<svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">'+[0,60,120,180,240,300].map(function(r){return '<g transform="rotate('+r+')"><path d="M0 0V-11M0-7.5l-2.6-2.6M0-7.5l2.6-2.6M0-3.8l-1.8-1.8M0-3.8l1.8-1.8"/></g>'}).join("")+'</svg>';
// Überschrift höchstens 540 px breit (Quadrat-Rand), Zeilen bei Bedarf kleiner
window.fertig=document.fonts.ready.then(function(){[].forEach.call(document.querySelectorAll("h1 span,.bis"),function(e){var max=e.classList.contains("bis")?560:540,f=parseFloat(getComputedStyle(e).fontSize);while(e.getBoundingClientRect().width>max&&f>30){f-=1;e.style.fontSize=f+"px"}})});
document.getElementById("sterne").innerHTML=[[236,182,26,.45],[60,236,18,.32],[1136,196,22,.4],[930,96,18,.3],[1090,566,24,.38],[250,560,20,.3],[150,140,16,.3]].map(function(a){return '<span class="stern" style="left:'+a[0]+'px;top:'+a[1]+'px;width:'+a[2]+'px;height:'+a[2]+'px;opacity:'+a[3]+'">'+F+'</span>'}).join("")</script>
</body></html>
