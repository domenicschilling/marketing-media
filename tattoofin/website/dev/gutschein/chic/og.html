<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Vorschaubild (og:image) 1200×630 für den Gutschein-Shop von Chic Tattoo Augsburg (dev/gutschein-seiten.mjs --og).
     Links echte Arbeit aus dem Studio (Löwe/Spartaner, Instagram @chic_tattoo_augsburg), rechts Angebot, alle Stufen, Frist und die
     Bedingung zum Sternchen. Die Überschrift beginnt im mittleren Quadrat (x 285–915), damit WhatsApp-Ausschnitte sie zeigen.
     Fassung „angebot“ (bis 24.12., 16 Uhr) und „danach“ (Wertgutschein). Jeder Text wird gemessen (window.passt). -->
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;src:url({{assets}}/schrift/archivo-var.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#F4F2EE}
#og{position:relative;width:1200px;height:630px;overflow:hidden;background:#F4F2EE;color:#0C0C0D;font-family:Archivo,sans-serif}
.foto{position:absolute;left:0;top:0;width:360px;height:630px;object-fit:cover;object-position:50% 40%}
.logo{position:absolute;left:278px;top:30px;width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 7px #F4F2EE}
.txt{position:absolute;left:452px;right:44px;top:36px;bottom:30px;display:flex;flex-direction:column}
.pille{align-self:flex-start;font:700 26px/1 Archivo;font-stretch:80%;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#0C0C0D;padding:12px 16px 11px}
h1{margin-top:22px;font-weight:800;font-stretch:66%;text-transform:uppercase;line-height:.9;letter-spacing:-.005em}
h1 span{display:block;white-space:nowrap;width:max-content}
h1 .a{font-size:78px}
h1 .b{font-size:122px;color:#C70F17}
ul{list-style:none;display:flex;gap:22px;margin-top:22px;width:max-content;font:700 34px/1 Archivo;font-stretch:72%;white-space:nowrap}
ul li span{color:#55555A}
ul li.auch{color:#0C0C0D;text-transform:uppercase;letter-spacing:.04em}
ul li i{font-style:normal;color:#C70F17;margin:0 6px}
.bis{margin-top:auto;display:flex;align-items:center;gap:16px;font:700 32px/1 Archivo;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bis b{width:16px;height:16px;background:#C70F17;flex:none}
.fuss{margin-top:12px;font:500 24px/1.2 Archivo;color:#3d3d41}
.danach h1 .b{font-size:96px}
.danach ul,.danach .fuss{display:none}
</style></head><body><div id="og" class="{{fassung}}">
<img class="foto" src="{{assets}}/{{kuerzel}}/hero-loewe-960.webp" alt="">
<img class="logo" src="{{assets}}/{{kuerzel}}/logo.png" alt="">
<div class="txt">
 <span class="pille m">{{pille}}</span>
 <h1><span class="a m">{{zeileA}}</span><span class="b m">{{zeileB}}</span></h1>
 <ul class="m"><li class="auch">Auch</li>{{{stufenOg}}}</ul>
 <div class="bis m"><b></b>{{bis}}</div>
 <p class="fuss m">{{fuss}}</p>
</div>
</div>
<script>
// Zu breite Zeilen verkleinern (höchstens bis 70 %), dann messen: alles innerhalb des Bildes und der Textspalte
document.fonts.ready.then(function () {
  var txt = document.querySelector(".txt").getBoundingClientRect(), fehler = [];
  document.querySelectorAll(".m").forEach(function (e) {
    if (getComputedStyle(e).display === "none") return;
    var gr = parseFloat(getComputedStyle(e).fontSize), min = gr * .7;
    while (e.getBoundingClientRect().width > txt.width + .5 && gr > min) { gr -= 1; e.style.fontSize = gr + "px"; }
    var r = e.getBoundingClientRect();
    if (r.right > txt.right + .5 || r.bottom > 630 || e.scrollWidth > e.clientWidth + 1) fehler.push(e.textContent.slice(0, 40));
  });
  window.passt = { ok: !fehler.length, fehler: fehler };
  window.fertig = true;
});
</script>
</body></html>
