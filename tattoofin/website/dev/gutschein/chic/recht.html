<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Erzeugt von dev/gutschein-seiten.mjs aus dev/gutschein/chic/recht.html – nicht von Hand ändern -->
<title>{{seitenTitel}} · Gutschein-Shop · {{name}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D0C0C">
<link rel="icon" href="/assets/gs-shop/{{kuerzel}}/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/gs-shop/{{kuerzel}}/icon-180.png">
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/assets/gs-shop/schrift/archivo-var.woff2) format("woff2")}
*{box-sizing:border-box}
body{margin:0;background:#0D0C0C;color:#F3EFEA;font:16px/1.6 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px}
.kopf img{height:52px;width:52px;display:block;border-radius:50%}
.kopf a{color:#F3EFEA;font-weight:650;text-decoration:none;padding:10px 0;white-space:nowrap}
h1{font-weight:800;font-stretch:66%;font-size:clamp(34px,10vw,56px);line-height:.95;text-transform:uppercase;margin:28px 0 14px;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:break-word}
h2{font-weight:750;font-size:19px;margin:30px 0 8px}
p,li{color:#D6D0C9;margin:10px 0}
ul,ol{padding-left:20px}
a{color:#FF4A50}
.kasten{background:#171515;padding:16px 18px;margin-top:18px}
nav.fuss{margin-top:48px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
nav.fuss a{color:#B9B2AA;padding:6px 0}
nav.fuss a[aria-current]{color:#F3EFEA;font-weight:650}
</style>
</head>
<body>
<main>
<div class="kopf"><a href="/gutschein-kaufen/{{slug}}" aria-label="Zurück zu den Gutscheinen von {{name}}"><img src="/assets/gs-shop/{{kuerzel}}/logo-120.webp" alt="{{name}}" width="52" height="52"></a><a href="/gutschein-kaufen/{{slug}}">← Zu den Gutscheinen</a></div>
<h1>{{{seitenTitelH1}}}</h1>
{{{inhalt}}}
<nav class="fuss" aria-label="Rechtliches">{{{fussLinks}}}</nav>
</main>
</body>
</html>
