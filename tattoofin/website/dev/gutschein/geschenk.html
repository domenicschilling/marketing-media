<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Hero-Bild „Geschenk“ je Stadt (dev/gutschein-seiten.mjs --og): Gutschein-Karte mit Logo, dunkelrotem Satinband und Schleife.
     Nur Grafik (keine Fotos, keine KI-Bilder). Durchsichtiger Hintergrund, gerendert mit doppelter Dichte. --><style>
@font-face{font-family:"Oswald";font-weight:500 700;src:url({{assets}}/schrift/oswald-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:800px;height:540px;overflow:hidden;background:transparent}
#g{position:relative;width:800px;height:540px}
.karte{position:absolute;left:50px;top:66px;width:700px;height:410px;border-radius:26px;overflow:hidden;
 background:linear-gradient(140deg,#241d13 0%,#100e0b 52%,#19140d 100%);border:2px solid rgba(214,180,112,.75);
 box-shadow:0 26px 50px rgba(0,0,0,.7),0 0 70px rgba(200,163,90,.16)}
.karte:before{content:"";position:absolute;inset:12px;border:1px solid rgba(200,163,90,.28);border-radius:17px}
.karte:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,240,205,.07) 48%,transparent 56%)}
.logo{position:absolute;left:222px;top:146px;width:430px;height:auto}
.wort{position:absolute;left:222px;width:430px;top:30px;text-align:center;font:600 21px/1 Oswald;letter-spacing:.42em;text-transform:uppercase;color:#d9be86;opacity:.9}
svg.band{position:absolute;left:0;top:0;width:800px;height:540px;overflow:visible}
</style></head><body><div id="g">
<div class="karte">
 <span class="wort">Gutschein</span>
 <img class="logo" src="{{assets}}/{{kuerzel}}/logo-gold-1400.webp" alt="">
</div>
<svg class="band" viewBox="0 0 800 540" aria-hidden="true">
 <defs>
  <linearGradient id="bv" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4c0b13"/><stop offset=".3" stop-color="#8f1825"/><stop offset=".5" stop-color="#c0394a"/><stop offset=".72" stop-color="#861622"/><stop offset="1" stop-color="#4c0b13"/></linearGradient>
  <linearGradient id="bh" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4c0b13"/><stop offset=".3" stop-color="#8f1825"/><stop offset=".5" stop-color="#c0394a"/><stop offset=".72" stop-color="#861622"/><stop offset="1" stop-color="#4c0b13"/></linearGradient>
  <linearGradient id="sl" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c63c4d"/><stop offset=".45" stop-color="#9a1b29"/><stop offset="1" stop-color="#560c15"/></linearGradient>
  <linearGradient id="sr" x1="1" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c63c4d"/><stop offset=".45" stop-color="#9a1b29"/><stop offset="1" stop-color="#560c15"/></linearGradient>

 </defs>
 <!-- Band um die Karte: senkrecht und waagrecht, Ränder in Gold -->
 <g clip-path="url(#kc)">

  <rect x="160" y="146" width="44" height="44" fill="#7a1420" opacity=".55"/>
 </g>
 <!-- Schleife auf der Kreuzung -->
 <g transform="translate(182 168)" filter="url(#sch)">

  <path d="M14-2C44-30 92-44 104-28 96-14 58-2 14 2Z" fill="#3a060c" opacity=".55"/>

 </g>

</div></body></html>
