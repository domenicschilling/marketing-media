<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nachweis zur Zahlung – Tattoofin</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/app.css">
<style>
body.app{background:#fff;padding-bottom:20px}
.nw{max-width:760px;margin:0 auto;padding:20px 18px}
.nw h1{font:400 28px/1.1 var(--head);margin:0 0 4px}
.nw h2{font:400 18px/1.2 var(--round);margin:22px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.nw table{width:100%;border-collapse:collapse;font-size:14px}
.nw th{text-align:left;color:var(--muted);font-weight:600;padding:5px 10px 5px 0;width:34%;vertical-align:top}
.nw td{padding:5px 0;vertical-align:top}
.nw .zitat{background:var(--cream);border-left:4px solid var(--ink);padding:8px 12px;font-size:14px;margin:6px 0}
.nw .sig{border:1px solid #cfd8e1;border-radius:8px;max-width:340px;background:#fff}
.nw .foto{max-width:320px;border-radius:8px;border:1px solid #cfd8e1}
.nw .entwurf{background:#fff3c4;border:2px solid var(--orange);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.nw .knopf{margin:14px 0}
@media print{.nw .knopf{display:none}.nw{padding:0}@page{margin:16mm}}
</style>
</head><body class="app">
<div class="nw">
  <div class="knopf"><button class="btn gold" onclick="print()">Als PDF speichern / drucken</button> <a class="btn ghost small" href="/app.html#zahlungen">Zurück zur App</a></div>
  <div id="inhalt"><p class="muted">Wird geladen …</p></div>
</div>
<script src="/js/common.js"></script>
<script>
(async function () {
  var e = TF.esc, euro = TF.euro;
  var zeit = function (iso) { return iso ? new Date(iso).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "–"; };
  var z = new URLSearchParams(location.search).get("z"), d;
  try { d = await TF.api("/api/portal/nachweis/" + encodeURIComponent(z || "")); }
  catch (err) { if (err.status === 401) location.href = "/login.html"; document.getElementById("inhalt").innerHTML = '<p>' + e(err.message) + "</p>"; return; }
  var Z = d.zahlung, L = d.leistung, S = d.studio, K = Z.kundeBestaetigt;
  var reihe = function (k, v) { return v ? "<tr><th>" + k + "</th><td>" + v + "</td></tr>" : ""; };
  document.getElementById("inhalt").innerHTML =
    '<p class="entwurf">Zusammenstellung der in Tattoofin gespeicherten Nachweise. Keine Rechtsberatung; ob sie im Einzelfall ausreichen, entscheiden Bank bzw. Zahlungsanbieter.</p>' +
    "<h1>Nachweis zur Zahlung</h1><p class=\"muted\">Erstellt am " + zeit(d.erstellt) + " mit Tattoofin · Zahlungs-Nr. " + e(Z.id) + "</p>" +
    "<h2>Studio</h2><table>" + reihe("Studio", e(S.firma)) + reihe("Inhaber/in", e(S.inhaber)) + reihe("Adresse", e(S.strasse + ", " + S.plz + " " + S.ort)) + "</table>" +
    "<h2>Zahlung</h2><table>" + reihe("Kunde", e(Z.kunde || "–")) + reihe("E-Mail", e(Z.email || "")) + reihe("Betrag", "<b>" + euro(Z.betragCent, true) + "</b>") +
      reihe("Projekt", e(Z.beschreibung || "")) + reihe("Sitzungen", e(Z.sitzungen || "")) + reihe("Art", Z.art === "anzahlung" || Z.anzahlung ? "Anzahlung" : "Zahlung") +
      reihe("Status", e(Z.status)) + reihe("Bezahlt am", zeit(Z.bezahltAm)) + reihe("Zahlart", e(Z.zahlartText || "")) + reihe("Stripe-Zahlung", e(Z.paymentIntentId || "")) + "</table>" +
    "<h2>1. Bestätigung beim Bezahlen</h2>" + (K ? "<p>Vor dem Bezahlen hat der Kunde per Häkchen bestätigt (" + zeit(K.am) + ", Version " + e(K.version || "") + "):</p><div class=\"zitat\">" + e(K.inhalt) + "</div>" +
      (K.ip ? '<p class="muted" style="font-size:12px">IP-Adresse: ' + e(K.ip) + "</p>" : "") : "<p class=\"muted\">Keine (Zahlung vor Einführung dieser Funktion oder noch nicht bezahlt).</p>") +
    (Z.bedingungen ? "<h2>2. Anzahlungsbedingungen bestätigt</h2><p>am " + zeit(Z.bedingungen.akzeptiertAm) + ":</p><div class=\"zitat\">" + e(Z.bedingungen.text) + "</div>" : "") +
    "<h2>" + (Z.bedingungen ? "3" : "2") + ". Leistungsbestätigung nach dem Termin</h2>" + (L ? "<p>Bestätigt am " + zeit(L.am) + " von <b>" + e(L.name) + "</b> (Termin: " + new Date(L.datum + "T12:00:00").toLocaleDateString("de-DE") + ", Version " + e(L.version) + "):</p><div class=\"zitat\">" + e(L.text) + "</div>" +
      '<p>Unterschrift:</p><img class="sig" src="' + L.unterschrift + '" alt="Unterschrift">' +
      (L.foto ? '<p>Foto (Einwilligung: „' + e(L.fotoEinwilligung || "") + '“):</p><img class="foto" src="' + L.foto + '" alt="Foto">' : "") +
      (L.ip ? '<p class="muted" style="font-size:12px">IP-Adresse: ' + e(L.ip) + "</p>" : "") : "<p class=\"muted\">Noch keine Leistungsbestätigung.</p>") +
    '<p class="muted" style="font-size:12px;margin-top:24px">Hinweis: Dieser Nachweis hilft bei Rückfragen und Rückbuchungen. Ob eine Rückbuchung zugunsten des Studios entschieden wird, entscheiden Bank bzw. Zahlungsanbieter.</p>';
})();
</script>
</body></html>
