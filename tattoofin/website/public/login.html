<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio-Login – Tattoofin</title><meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1f3d5c"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/assets/figur.png"><link rel="stylesheet" href="/css/site.css">
</head><body>
<header class="nav"><div class="wrap"><a class="brand" href="/"><img src="/assets/figur.png" alt=""><img class="wm" src="/assets/wortmarke.png" alt="Tattoofin"></a></div></header>
<main class="sec"><div class="wrap" style="max-width:480px">
  <form id="f" class="form">
    <h1 style="font-size:30px;margin-bottom:8px">Dein Studio-Bereich</h1>
    <p class="muted" style="margin:0 0 20px">Kein Passwort nötig: Wir schicken dir einen Login-Link per E-Mail.</p>
    <div id="alert"></div>
    <div class="field"><label for="email">E-Mail-Adresse deines Studios</label><input type="email" id="email" required autocomplete="email"></div>
    <button class="btn gold" style="width:100%" id="btn">Login-Link schicken</button>
    <p class="muted" style="font-size:13.5px;margin:12px 0 0">Tipp: Öffne den Link aus der E-Mail auf dem Handy. Danach bleibst du 30 Tage angemeldet.</p>
    <p class="muted" style="font-size:14px;margin:18px 0 0">Noch kein Kunde? <a href="/start.html">Jetzt starten</a></p>
  </form>
</div></main>
<script src="/js/common.js"></script>
<script>
var a = document.getElementById("alert");
if (new URLSearchParams(location.search).get("weiter") === "einrichtung") a.innerHTML = '<div class="alert info">Bitte melde dich kurz an. Danach geht es mit der Einrichtung deines Zahlungskontos weiter.</div>';
var q = new URLSearchParams(location.search), WA = "https://wa.me/491624502375?text=" + encodeURIComponent("Hi, mein Login-Link für Tattoofin funktioniert nicht. Kannst du mir helfen?");
function hinweisVerzoegert(r) { return r && r.verzoegert ? '<br><small>Unser Mailversand ist gerade langsamer als sonst. Kommt nichts an, schreib uns kurz per <a href="' + WA + '" target="_blank" rel="noopener">WhatsApp</a>, dann schicken wir dir den Link direkt.</small>' : ""; }
if (q.get("abgelaufen")) {
  var neu = q.get("neu");
  // Den alten Link aus der Adresszeile entfernen (nicht im Verlauf lassen)
  try { history.replaceState(null, "", "/login.html?abgelaufen=1"); } catch (x) {}
  a.innerHTML = '<div class="alert err" id="abg"><b>Dieser Login-Link ist abgelaufen oder wurde schon benutzt.</b><br>' +
    (neu ? 'Kein Problem: Wir schicken dir sofort einen neuen an die E-Mail-Adresse deines Studios.<div style="margin-top:12px"><button type="button" class="btn gold" style="width:100%" id="neu-btn">Neuen Login-Link schicken</button></div>'
         : "Gib unten die E-Mail-Adresse deines Studios ein, dann schicken wir dir einen neuen Link.") +
    '<small style="display:block;margin-top:10px">Login-Links gelten 24 Stunden und funktionieren einmal. Hilfe: <a href="' + WA + '" target="_blank" rel="noopener">WhatsApp</a></small></div>';
  var nb = document.getElementById("neu-btn");
  if (nb) nb.onclick = async function () {
    nb.disabled = true; nb.textContent = "Wird geschickt …";
    try {
      var r = await TF.api("/api/login", { body: { neu: neu } });
      a.innerHTML = '<div class="alert ok"><b>Neuer Link ist unterwegs' + (r.an ? " an " + TF.esc(r.an) : "") + ".</b> Schau in dein Postfach (auch im Spam-Ordner)." + (r.gedrosselt ? "<br><small>Du hast gerade schon mehrere Links angefordert. Bitte nimm den neuesten aus deinem Postfach.</small>" : "") + hinweisVerzoegert(r) + "</div>";
    } catch (err) { nb.disabled = false; nb.textContent = "Neuen Login-Link schicken"; a.insertAdjacentHTML("beforeend", '<div class="alert err">' + TF.esc(err.message) + "</div>"); }
  };
}
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var b = document.getElementById("btn"); b.disabled = true;
  try {
    var r = await TF.api("/api/login", { body: { email: document.getElementById("email").value } });
    a.innerHTML = '<div class="alert ok">Wenn es zu dieser E-Mail ein Studio gibt, ist der Link unterwegs. Schau auch im Spam-Ordner nach.' + hinweisVerzoegert(r) + "</div>";
  } catch (err) { a.innerHTML = '<div class="alert err">' + TF.esc(err.message) + "</div>"; }
  b.disabled = false;
});
</script>
</body></html>
