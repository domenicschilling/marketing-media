<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bezahlen – Tattoofin</title><meta name="robots" content="noindex">
<link rel="icon" href="/assets/figur.png"><link rel="stylesheet" href="/css/site.css">
</head><body style="background:var(--cream)">
<main class="sec tight"><div class="wrap">
  <form class="paybox" id="f">
    <div class="muted" style="font-weight:600">Bezahlen bei</div>
    <h1 style="font-size:28px;margin:4px 0 14px" id="studio">…</h1>
    <div id="alert"></div>
    <div class="field"><label for="betrag">Betrag in € (wie mit dem Studio abgesprochen)</label><input type="text" inputmode="decimal" id="betrag" required placeholder="z. B. 1.500"></div>
    <div class="field"><label for="kunde">Dein Name</label><input type="text" id="kunde" required autocomplete="name"></div>
    <div class="field"><label for="email">Deine E-Mail (für die Bestätigung)</label><input type="email" id="email" autocomplete="email"></div>
    <div class="field"><label for="beschreibung">Wofür? (optional)</label><input type="text" id="beschreibung" placeholder="z. B. Anzahlung Rückenstück"></div>
    <button class="btn gold" id="pay" style="width:100%">Weiter zur Zahlung</button>
    <p class="fn">Beim Bezahlen siehst du, welche Zahlungsoptionen dir angeboten werden, je nach Prüfung durch den Zahlungsanbieter auch Ratenzahlung oder späteres Bezahlen. Die Bedingungen legt allein der Zahlungsanbieter fest.</p>
    <p class="fn" style="margin-top:14px;display:flex;align-items:center;gap:8px"><img src="/assets/figur.png" alt="" style="width:26px"> Sichere Zahlung über Stripe · bereitgestellt von Tattoofin</p>
  </form>
</div></main>
<script src="/js/common.js"></script>
<script>
(async function () {
  var slug = new URLSearchParams(location.search).get("s"), a = document.getElementById("alert"), btn = document.getElementById("pay");
  function err(t) { a.innerHTML = '<div class="alert err">' + TF.esc(t) + "</div>"; }
  try {
    var d = await TF.api("/api/pay?s=" + encodeURIComponent(slug));
    document.getElementById("studio").textContent = d.studio.firma;
    if (!d.studio.aktiv) { btn.disabled = true; err("Bei diesem Studio ist die Online-Zahlung gerade nicht verfügbar."); }
  } catch (e) { btn.disabled = true; err(e.message); }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault(); btn.disabled = true; btn.textContent = "Einen Moment …";
    try {
      var r = await TF.api("/api/pay", { body: { s: slug, betrag: document.getElementById("betrag").value, kunde: document.getElementById("kunde").value, email: document.getElementById("email").value, beschreibung: document.getElementById("beschreibung").value } });
      location.href = r.url;
    } catch (e) { err(e.message); btn.disabled = false; btn.textContent = "Weiter zur Zahlung"; }
  });
})();
</script>
</body></html>
