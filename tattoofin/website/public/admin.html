<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Tattoofin</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/figur.png"><link rel="stylesheet" href="/css/site.css">
<style>.tbl tr[data-id]{cursor:pointer}.tbl tr[data-id]:hover td{background:#faf8f3}pre{white-space:pre-wrap;font-size:12px;background:#f4f2ee;border-radius:10px;padding:10px;max-height:340px;overflow:auto}</style>
</head><body>
<header class="nav"><div class="wrap"><a class="brand" href="/admin.html"><img src="/assets/figur.png" alt=""><img class="wm" src="/assets/wortmarke.png" alt="Tattoofin"> Admin</a><nav class="links"><a href="#" id="out" class="hidden">Abmelden</a></nav></div></header>
<main class="sec tight"><div class="wrap">
  <div id="alert"></div>
  <div id="login" class="hidden" style="max-width:440px">
    <form id="login-mail" class="form"><h2 style="font-size:24px;margin-bottom:12px">Admin-Login</h2>
      <div class="field"><label for="admin-email">E-Mail</label><input type="email" id="admin-email" name="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required></div>
      <button class="btn gold">Login-Link schicken</button>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Nur für hinterlegte Admin-Adressen. Der Link ist 2 Stunden gültig und einmal verwendbar, danach bleibst du 12 Stunden angemeldet.</p></form>
    <details style="margin-top:18px"><summary>Anmeldung mit Admin-Token</summary>
      <form id="login-token" class="form" style="margin-top:10px"><div class="field"><label for="token">Admin-Token (Netlify-Variable ADMIN_TOKEN)</label><input type="password" id="token" autocomplete="current-password"></div><button class="btn dark small">Anmelden</button></form></details>
  </div>

  <div id="app" class="hidden">
    <div id="hinweise"></div>
    <div class="kpis" id="kpis"></div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">Studios</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="month" id="monat" style="width:auto">
          <button class="btn ghost small" id="abr-test">Abrechnung testen</button>
          <button class="btn dark small" id="abr-los">Abrechnung erstellen</button>
          <button class="btn ghost small" id="jobs">Tägliche Jobs</button>
          <button class="btn ghost small" id="konten">Alle Stripe-Status abgleichen</button>
        </div></div>
      <div class="scroll" style="margin-top:14px" id="liste"></div>
    </div>
    <div class="panel hidden" id="detail"></div>
    <div class="panel"><h2>Letzte E-Mails</h2><div class="scroll" id="mails"></div></div>
    <div class="panel"><h2>Ergebnis</h2><pre id="out-json">–</pre></div>
  </div>
</div></main>
<script src="/js/common.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, e = TF.esc;
  var token = sessionStorage.getItem("tf-admin") || "";
  function api(p, o) { o = o || {}; if (token) o.headers = { Authorization: "Bearer " + token }; return TF.api("/api/admin/" + p, o); }
  function msg(t, ty) { $("alert").innerHTML = t ? '<div class="alert ' + (ty || "ok") + '">' + e(t) + "</div>" : ""; }
  function zeig(x) { $("out-json").textContent = JSON.stringify(x, null, 2); }
  var vm = new Date(); vm.setMonth(vm.getMonth() - 1); $("monat").value = vm.toISOString().slice(0, 7);

  async function start() {
    try { var list = await api("studios"); } catch (err) { if (err.status === 401) { $("login").classList.remove("hidden"); $("app").classList.add("hidden"); return; } msg(err.message, "err"); return; }
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("out").classList.remove("hidden");
    var live = list.filter(function (s) { return s.status === "live"; });
    $("kpis").innerHTML = [[list.length, "Studios gesamt"], [live.length, "live"], [TF.euro(list.reduce(function (a, s) { return a + s.umsatzCent; }, 0)), "Umsatz über Tattoofin"], [TF.euro(list.reduce(function (a, s) { return a + s.provisionNettoCent; }, 0)), "Provision gesamt (netto)"], [TF.euro(list.reduce(function (a, s) { return a + s.deckungsbeitragCent; }, 0)), "nach Stripe-Gebühren"]]
      .map(function (k) { return '<div class="kpi"><b>' + k[0] + "</b><span>" + k[1] + "</span></div>"; }).join("");
    $("liste").innerHTML = '<table class="tbl"><tr><th>Studio</th><th>Modell</th><th>Status</th><th>Stripe</th><th>Seit</th><th>Zahlungen</th><th>Umsatz</th><th>Provision netto</th><th>nach Gebühren</th><th>Fragebogen</th></tr>' +
      list.map(function (s) {
        return '<tr data-id="' + e(s.id) + '"><td><b>' + e(s.firma) + "</b><br><small>" + e(s.ort || "") + " · " + e(s.email) + "</small></td><td>" + e(s.paket || s.modell) + (s.provisionProzent ? " · " + e(s.provisionProzent) + " %" : "") + (s.recht ? "<br><small>Recht ✓ " + e(s.recht) + "</small>" : "") + (s.extras ? "<br><small>Extras: " + e(s.extras) + "</small>" : "") + '</td><td><span class="tag ' + e(s.status) + '">' + e(s.statusText) + "</span></td><td>" + e(s.stripe) + "</td><td>" + TF.datum(s.createdAt) +
          "</td><td>" + s.zahlungen + (s.offen ? " (+" + s.offen + " offen)" : "") + "</td><td>" + TF.euro(s.umsatzCent) + "</td><td>" + TF.euro(s.provisionNettoCent, true) + "</td><td>" + TF.euro(s.deckungsbeitragCent, true) + "</td><td>" + (s.fragebogen ? "✓" : "–") + "</td></tr>";
      }).join("") + "</table>";
    hinweise();
    var mails = await api("mails");
    $("mails").innerHTML = '<table class="tbl"><tr><th>Zeit</th><th>An</th><th>Betreff</th></tr>' + mails.map(function (m) { return "<tr><td>" + new Date(m.at).toLocaleString("de-DE") + "</td><td>" + e(m.to) + "</td><td>" + e(m.subject) + "</td></tr>"; }).join("") + "</table>";
    var h = location.hash.slice(1); if (h) detail(h);
  }

  // Hinweise oben: hängende Mails (Warteschlange) und Ergebnis des stündlichen Gesundheits-Checks
  async function hinweise() {
    var h = [];
    try {
      var m = await api("mail-status");
      if (m.anzahl > 0) h.push('<div class="alert err"><b>⚠️ ' + m.anzahl + (m.anzahl === 1 ? " E-Mail hängt" : " E-Mails hängen") + " in der Warteschlange</b> (seit " + e(m.aeltesteSeit ? new Date(m.aeltesteSeit).toLocaleString("de-DE") : "?") + "). Der Mailserver nimmt gerade nichts an" + (m.letzterFehler ? ": <small>" + e(m.letzterFehler.slice(0, 160)) + "</small>" : "") + ". Wir versuchen es alle 10 Minuten erneut (bis 6 Stunden). Login-Links kannst du solange unten beim Studio mit „Login-Link erzeugen“ per WhatsApp weitergeben." +
        (m.wege && m.wege.indexOf("resend") < 0 ? "<br><small>Tipp: Zweiten Versanddienst einrichten (Netlify-Variable RESEND_API_KEY), dann springt er automatisch ein.</small>" : "") +
        '<div style="margin-top:8px"><button class="btn dark small" id="mail-nach">Jetzt erneut senden</button></div></div>');
    } catch (x) {}
    try {
      var g = await api("gesundheit");
      if (g && g.ok === false) h.push('<div class="alert err"><b>Gesundheits-Check ' + e(new Date(g.am).toLocaleString("de-DE")) + ":</b> " + e((g.fehler || []).join(" · ")) + "</div>");
    } catch (x) {}
    $("hinweise").innerHTML = h.join("");
    var b = $("mail-nach"); if (b) b.onclick = async function () { b.disabled = true; try { zeig(await api("mail-nachsenden", { body: {} })); } catch (err) { msg(err.message, "err"); } hinweise(); };
  }

  async function detail(id) {
    var d = await api("studio/" + id), s = d.studio, p = $("detail");
    location.hash = id;
    p.classList.remove("hidden");
    p.innerHTML = "<h2>" + e(s.firma) + "</h2>" +
      '<div class="grid2"><div><table class="tbl">' + [["Inhaber", s.inhaber], ["E-Mail", s.email], ["Handy", s.telefon], ["Studio-Tel.", s.studioTelefon], ["Adresse", s.strasse + ", " + s.plz + " " + s.ort], ["Paket", (s.paket || s.modell) + (s.provisionProzent ? " · " + s.provisionProzent + " %" : "") + (s.preisNetto ? " · " + TF.euro(s.preisNetto) : "") + (s.monatNetto ? " · " + TF.euro(s.monatNetto) + "/Monat" : "") + (s.paket === "monatlich" || s.paket === "einmal" ? " · QR-Aufsteller: " + (d.aufstellerLink || "") : "")], ["Zahlart", s.zahlart], ["Vertrag", (s.vertrag || {}).version + " · " + TF.datum((s.vertrag || {}).akzeptiertAm) + " · " + ((s.vertrag || {}).name || "") + " · IP " + ((s.vertrag || {}).ip || "")], ["Stripe-Konto", ((s.stripe || {}).accountId || "–") + ((s.stripe || {}).chargesEnabled ? " · freigegeben" : " · nicht freigegeben")], ["Zahlseite", location.origin + "/zahlen/" + s.slug], ["Live seit", TF.datum(s.goLiveAt)], ["Kündigung", s.kuendigung ? TF.datum(s.kuendigung.zum) + (s.kuendigung.garantie ? " (GARANTIE)" : "") + " · " + (s.kuendigung.grund || "") : "–"]]
        .map(function (r) { return "<tr><th>" + r[0] + "</th><td>" + e(r[1] || "–") + "</td></tr>"; }).join("") + "</table></div><div>" +
      '<div class="field"><label>Notiz</label><textarea id="d-notiz">' + e(s.notiz || "") + "</textarea></div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark small" id="d-save">Speichern</button><button class="btn gold small" id="d-live">Live schalten + E-Mail</button>' +
      '<button class="btn ghost small" id="d-konto">Stripe-Status jetzt abgleichen</button><button class="btn ghost small" id="d-link">Login-Link erzeugen</button><button class="btn ghost small" id="d-einr">Einrichtungslink erzeugen</button><button class="btn dark small" id="d-ansehen">Dashboard ansehen</button>' +
      '<div id="d-linkbox" style="margin-top:10px"></div>' +
      '<details id="d-brand" style="margin-top:12px"' + (s.branding ? "" : " open") + '><summary><b>Logo/Farbe für Studio setzen</b>' + (s.branding ? " ✓ hinterlegt" + (s.branding.stripeAm ? ", bei Stripe gesetzt " + e(TF.datum(s.branding.stripeAm)) : "") : "") + '</summary>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0" id="b-vorschau"></div>' +
        '<div class="field"><label for="b-icon">Icon (quadratisch, mind. 128 px, PNG/JPG)</label><input type="file" id="b-icon" accept="image/png,image/jpeg"></div>' +
        '<div class="field"><label for="b-logo">Logo (breit, PNG/JPG)</label><input type="file" id="b-logo" accept="image/png,image/jpeg"></div>' +
        '<div style="display:flex;gap:14px;flex-wrap:wrap"><div class="field"><label for="b-farbe">Markenfarbe (Hintergrund)</label><input type="color" id="b-farbe" value="' + e((s.branding && s.branding.farbe) || "#111111") + '"></div>' +
        '<div class="field"><label for="b-akzent">Akzentfarbe (Knöpfe)</label><input type="color" id="b-akzent" value="' + e((s.branding && s.branding.akzent) || "#b08d57") + '"></div>' +
        '<div class="field"><label for="b-kurz">Kurzbezeichnung Abrechnung (5–22 Zeichen)</label><input type="text" id="b-kurz" maxlength="22" autocomplete="off" value="' + e((s.branding && s.branding.kurzbezeichnung) || String(s.firma || "").toUpperCase().slice(0, 22)) + '"></div></div>' +
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="b-hell"' + (s.branding && s.branding.logoHell ? " checked" : "") + '> Logo ist für hellen Hintergrund gemacht</label>' +
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0 10px"><input type="checkbox" id="b-stripe"' + (s.stripe && s.stripe.accountId ? " checked" : " disabled") + '> auch beim Stripe-Konto des Studios setzen (Kasse, Belege)</label>' +
        '<button class="btn dark small" id="b-save">Branding speichern</button></details>' +
      (s.modell === "kauf" && s.stripe && s.stripe.paymentIntentId ? '<button class="btn ghost small" id="d-refund" style="color:var(--red)">Garantie erstatten</button>' : "") + "</div></div></div>" +
      "<h2 style='margin-top:20px;font-size:18px'>Fragebogen</h2><pre>" + e(JSON.stringify(s.fragebogen || {}, null, 2)) + "</pre>" +
      "<h2 style='font-size:18px'>Zahlungen (" + d.zahlungen.length + ")</h2><pre>" + e(d.zahlungen.map(function (z) { return TF.datum(z.bezahltAm || z.createdAt) + " · " + z.status + " · " + TF.euro(z.betragCent, true) + " · " + (z.kunde || "") + " · " + (z.zahlartText || "") + (z.gebuehrNettoCent ? " · Provision " + TF.euro(z.gebuehrNettoCent, true) : "") + (z.abgerechnet ? " [abgerechnet " + z.abgerechnet + "]" : ""); }).join("\n")) + "</pre>" +
      "<h2 style='font-size:18px'>Abrechnungen</h2><pre>" + e(JSON.stringify(d.abrechnungen.map(function (a) { return { monat: a.monat, umsatz: a.umsatzCent, provisionNetto: a.provisionNettoCent, rechnung: a.rechnungNr }; }), null, 2)) + "</pre>";
    $("d-save").onclick = async function () { zeig(await api("studio/" + id, { method: "PATCH", body: { notiz: $("d-notiz").value } })); msg("Gespeichert."); };
    $("d-ansehen").onclick = async function () { try { var r = await api("studio/" + id + "/ansehen", { body: {} }); location.href = r.url; } catch (err) { msg(err.message, "err"); } };
    $("d-live").onclick = async function () { if (!confirm("Live schalten und Go-live-E-Mail senden?")) return; try { zeig(await api("studio/" + id + "/live", { body: {} })); msg("Live geschaltet."); start(); } catch (err) { msg(err.message, "err"); } };
    $("d-konto").onclick = async function () {
      try {
        var r = await api("studio/" + id + "/konto", { body: {} }); zeig(r);
        var o = r.offen || {}, fehlt = (o.faellig || []).concat(o.ueberfaellig || []);
        msg("Stripe abgeglichen: " + (r.nachher.freigegeben ? "Zahlungen freigegeben" : "noch nicht freigegeben") + ", Auszahlungen " + (r.nachher.auszahlungen ? "an" : "aus") + ", Angaben " + (r.nachher.angaben ? "gemacht" : "unvollständig") + (fehlt.length ? ". Stripe braucht noch: " + fehlt.join(", ") : "") + (o.inPruefung && o.inPruefung.length ? ". In Prüfung: " + o.inPruefung.join(", ") : "") + (o.sperrgrund ? ". Grund: " + o.sperrgrund : "") + ".", r.nachher.freigegeben ? "ok" : "info");
        start();
      } catch (err) { msg(err.message, "err"); }
    };
    function linkZeigen(r, titel) {
      $("d-linkbox").innerHTML = '<div class="alert info"><b>' + e(titel) + "</b> (gültig " + e(r.gueltig || "") + ', zum Weitergeben z. B. per WhatsApp)<br><input type="text" readonly id="d-linktext" style="width:100%;margin:8px 0" value="' + e(r.url) + '"><button class="btn dark small" id="d-copy">Link kopieren</button></div>';
      $("d-copy").onclick = async function () { try { await navigator.clipboard.writeText(r.url); } catch (x) { $("d-linktext").select(); document.execCommand("copy"); } $("d-copy").textContent = "Kopiert ✓"; };
    }
    $("d-link").onclick = async function () { try { linkZeigen(await api("studio/" + id + "/login-link", { body: {} }), "Login-Link"); } catch (err) { msg(err.message, "err"); } };
    $("d-einr").onclick = async function () { try { linkZeigen(await api("studio/" + id + "/einrichtungslink", { body: {} }), "Einrichtungslink (Stripe-Zahlungskonto)"); } catch (err) { msg(err.message, "err"); } };
    // Branding: Bilder im Browser verkleinern (max. 1000 px, unter ~500 KB für Stripe), dann als data-URL senden
    function bildLesen(input, quadrat) {
      var f = input.files && input.files[0]; if (!f) return Promise.resolve(null);
      return new Promise(function (ok, no) {
        var r = new FileReader(); r.onerror = no;
        r.onload = function () {
          var img = new Image(); img.onerror = function () { no(new Error("Bild konnte nicht gelesen werden.")); };
          img.onload = function () {
            var max = 1000, sk = Math.min(1, max / Math.max(img.width, img.height));
            if (sk === 1 && f.size < 480000 && !quadrat) return ok(r.result);
            var w = Math.round(img.width * sk), h = Math.round(img.height * sk), c = document.createElement("canvas");
            if (quadrat) { var m = Math.min(w, h, 512); c.width = c.height = m; var q = Math.min(img.width, img.height); c.getContext("2d").drawImage(img, (img.width - q) / 2, (img.height - q) / 2, q, q, 0, 0, m, m); }
            else { c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); }
            var png = f.type === "image/png", url = c.toDataURL(png ? "image/png" : "image/jpeg", 0.9);
            if (png && url.length > 650000) url = c.toDataURL("image/jpeg", 0.9);
            ok(url);
          };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      });
    }
    function brandVorschau(o) {
      if (!o) return;
      $("b-vorschau").innerHTML = [o.iconUrl, o.logoUrl].filter(Boolean).map(function (u) { return '<img src="' + e(u) + '" alt="" style="max-height:80px;border-radius:10px;border:2px solid #222;background:' + e(o.logoHell ? "#fff" : (o.farbe || "#111")) + '">'; }).join("") +
        (o.farbe ? '<span class="muted" style="font-size:13px">Farbe ' + e(o.farbe) + (o.akzent ? " · Akzent " + e(o.akzent) : "") + "</span>" : "");
    }
    api("studio/" + id + "/branding").then(function (r) { brandVorschau(r.oeffentlich); }).catch(function () {});
    $("b-save").onclick = async function () {
      var btn = $("b-save"); btn.disabled = true;
      try {
        var b = { icon: await bildLesen($("b-icon"), true), logo: await bildLesen($("b-logo"), false), farbe: $("b-farbe").value, akzent: $("b-akzent").value, kurzbezeichnung: $("b-kurz").value, logoHell: $("b-hell").checked, stripe: $("b-stripe").checked };
        var r = await api("studio/" + id + "/branding", { body: b }); zeig(r); brandVorschau(r.oeffentlich);
        msg("Branding gespeichert" + (b.stripe ? (r.stripe && r.stripe.fehler ? " – Stripe meldet: " + r.stripe.fehler : " und bei Stripe gesetzt.") : "."), r.stripe && r.stripe.fehler ? "err" : "ok");
      } catch (err) { msg(err.message, "err"); }
      btn.disabled = false;
    };
    var rf = $("d-refund"); if (rf) rf.onclick = async function () { if (!confirm("Kaufpreis wirklich vollständig erstatten?")) return; try { zeig(await api("studio/" + id + "/erstattung", { body: {} })); msg("Erstattet."); start(); } catch (err) { msg(err.message, "err"); } };
    p.scrollIntoView({ behavior: "smooth" });
  }

  document.addEventListener("click", function (ev) { var tr = ev.target.closest("tr[data-id]"); if (tr) detail(tr.dataset.id); });
  $("abr-test").onclick = async function () { zeig(await api("abrechnung", { body: { monat: $("monat").value, dryRun: true } })); };
  $("abr-los").onclick = async function () { if (!confirm("Abrechnung für " + $("monat").value + " wirklich erstellen? Rechnungen werden erzeugt und eingezogen.")) return; try { zeig(await api("abrechnung", { body: { monat: $("monat").value, dryRun: false } })); msg("Abrechnung erstellt."); } catch (err) { msg(err.message, "err"); } };
  $("jobs").onclick = async function () { zeig(await api("jobs", { body: {} })); };
  $("konten").onclick = async function () { try { var r = await api("konten-abgleichen", { body: {} }); zeig(r); msg(r.length + " Stripe-Konten abgeglichen."); start(); } catch (err) { msg(err.message, "err"); } };
  $("login-token").addEventListener("submit", function (ev) { ev.preventDefault(); token = $("token").value; sessionStorage.setItem("tf-admin", token); start(); });
  $("login-mail").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    try { await TF.api("/api/admin-login", { body: { email: $("admin-email").value } }); msg("Wenn die Adresse als Admin hinterlegt ist, ist der Login-Link unterwegs. Schau auch im Spam-Ordner nach."); } catch (err) { msg(err.message, "err"); }
  });
  $("out").onclick = async function (ev) { ev.preventDefault(); sessionStorage.removeItem("tf-admin"); try { await TF.api("/api/admin-login/abmelden", { body: {} }); } catch (x) {} location.reload(); };
  var qa = new URLSearchParams(location.search);
  if (qa.get("abgelaufen")) msg("Der Admin-Link ist abgelaufen oder ungültig. Fordere einfach einen neuen an.", "err");
  if (qa.get("ansicht") === "abgelaufen") msg("Der Link für die Dashboard-Ansicht ist abgelaufen. Bitte erneut auf „Dashboard ansehen“ klicken.", "err");
  start();
})();
</script>
</body></html>
