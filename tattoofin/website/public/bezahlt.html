<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danke für deine Zahlung – Tattoofin</title><meta name="robots" content="noindex"><meta name="theme-color" content="#1f3d5c">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/kunde.css">
</head><body class="app kunde">
<main class="app-main">
  <div class="card-a" style="text-align:center">
    <img src="/assets/figur.png" alt="" style="width:110px;margin:0 auto">
    <h1 id="titel" style="margin:12px 0 8px">Danke! 🖤</h1>
    <p class="muted" id="ort-zeile" style="margin:-4px 0 8px;font-size:14px"></p>
    <p id="msg" class="muted" style="font-size:17px">Deine Zahlung wird bestätigt …</p>
    <p id="zurueck" class="hidden"><a class="btn gold" id="zurueck-link" href="#">Nochmal versuchen</a></p>
    <p class="fuss" id="fuss">Den Beleg bekommst du per E-Mail. Fragen zur Zahlung klärst du mit dem Studio.</p>
  </div>
  <p class="powered"><img src="/assets/figur.png" alt=""> Sichere Zahlung über Stripe · bereitgestellt von Tattoofin · <a href="/impressum.html" target="_blank">Impressum</a> · <a href="/datenschutz.html#zahlseiten" target="_blank">Datenschutz</a></p>
</main>
<script src="/js/common.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), z = q.get("z"), n = 0, msg = document.getElementById("msg");
  // Rückkehr vom eingebetteten Bezahlfeld (z. B. nach Klarna): Stripe hängt redirect_status an
  if (q.get("redirect_status") === "failed") {
    document.getElementById("titel").textContent = "Nicht geklappt";
    msg.textContent = "Die Zahlung wurde nicht abgeschlossen. Es wurde nichts abgebucht. Du kannst es nochmal versuchen.";
    document.getElementById("zurueck").classList.remove("hidden");
    document.getElementById("zurueck-link").href = "/zahlung.html?z=" + encodeURIComponent(z || "");
    return;
  }
  function check() {
    TF.api("/api/pay?abgleich=1&z=" + encodeURIComponent(z)).then(function (d) {
      var ort = [d.studio.strasse, [d.studio.plz, d.studio.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      document.getElementById("ort-zeile").textContent = d.studio.firma + (ort ? " · " + ort : "");
      if (d.zahlung.status === "bezahlt") {
        // Drei Texte je Art: Projekt, Anzahlung, Gutschein
        var z = d.zahlung, betrag = TF.euro(z.betragCent, true), art = z.art;
        if (art === "gutschein") msg.textContent = d.studio.firma + " hat deine Zahlung über " + betrag + " erhalten. Den Gutschein mit Code schicken wir dir in wenigen Minuten per E-Mail (bitte auch im Spam-Ordner nachsehen).";
        else if (art === "anzahlung") msg.textContent = d.studio.firma + " hat deine Anzahlung über " + betrag + " erhalten. Sie wird mit dem Preis deines Tattoos verrechnet." + (z.restCent ? " Den Rest von " + TF.euro(z.restCent, true) + " zahlst du direkt im Studio." : " Den Rest zahlst du direkt im Studio.");
        else msg.textContent = d.studio.firma + " hat deine Zahlung über " + betrag + " erhalten. Danke!";
        // Klarna-Satz nur, wenn wirklich mit Klarna bezahlt wurde (nur der Name, ohne Raten-Aussage)
        document.getElementById("fuss").textContent = (art === "gutschein" ? "Die Rechnung bzw. den Beleg bekommst du per E-Mail. " : "Den Beleg bekommst du per E-Mail. ") +
          (z.zahlart === "klarna" ? "Du hast mit Klarna bezahlt. Fragen zu deiner Klarna-Zahlung klärst du direkt mit Klarna." : "Fragen zur Zahlung klärst du mit dem Studio.");
      }
      else if (d.zahlung.status === "in_pruefung") msg.textContent = "Deine Zahlung wird gerade vom Zahlungsanbieter bearbeitet. Das Studio bekommt automatisch Bescheid.";
      else if (n++ < 10) setTimeout(check, 1500);
      else msg.textContent = "Danke! Das Studio bekommt automatisch Bescheid, sobald die Zahlung bestätigt ist.";
    }).catch(function () { msg.textContent = "Danke für deine Zahlung!"; });
  }
  check();
})();
</script>
</body></html>
