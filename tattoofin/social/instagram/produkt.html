<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Tattoofin · Produkt-Werbemittel</title>
<link rel="stylesheet" href="insta.css">
<style>
body{padding:40px;display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start}
.frame.s{width:1080px;height:1350px;font-size:10px}
.frame.sq{width:1080px;height:1080px;font-size:8.4px}
.frame.st{width:1080px;height:1920px;font-size:10.6px}
.pr{background:#0c1a29}
.pr .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,26,41,.55) 0%,rgba(12,26,41,0) 30%,rgba(12,26,41,0) 42%,rgba(12,26,41,.88) 66%,rgba(12,26,41,.97) 100%)}
.pr .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:6.4em 6.4em 4.4em;color:#fff}
.frame.st.pr .in{padding:250px 64px 300px}
.pr .kopf{display:flex;justify-content:space-between;align-items:center}
.pr .kopf .stk{font-size:3em}
.pr .kopf img{height:4.4em;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.pr .sp{flex:1}
.pr .h{color:#fff;line-height:.98;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.pr .h .y{color:var(--y)}
.pr .sub{font:600 3.5em/1.32 'DM Sans';color:#e6eef6;margin-top:.5em}
.pr .chips{display:flex;flex-wrap:wrap;gap:1em;margin-top:2.2em}
.pr .chips span{background:#fff;color:var(--ink);border:4px solid #0c1a29;border-radius:99px;padding:.45em .9em;font:800 2.8em/1 'DM Sans'}
.pr .offer{display:flex;align-items:center;justify-content:space-between;gap:2em;margin-top:2.4em;background:var(--y);color:var(--ink);border:5px solid #0c1a29;border-radius:30px;padding:1.3em 1.8em;box-shadow:9px 9px 0 rgba(0,0,0,.35)}
.pr .offer b{display:block;font:400 4.8em/1 'Luckiest Guy'}
.pr .offer small{display:block;font:700 2.5em/1.25 'DM Sans';margin-top:.25em}
.pr .offer .btn{font-size:3.4em;padding:.55em 1em;white-space:nowrap}
.pr .fn{color:#fff;font-size:2em;margin-top:1.3em;opacity:.85}
.mini{position:absolute;background:var(--ink);border-radius:46px;padding:12px;box-shadow:14px 14px 0 rgba(0,0,0,.35);z-index:2}
.mini .scr{background:#fff;border-radius:36px;height:100%;padding:28px 24px;color:var(--ink)}
.mini .opt{font-size:24px;padding:12px 16px;margin-bottom:10px}
.mini .opt em{font-size:17px}
</style></head><body>
<script>
"use strict";
// Produkt-Werbemittel (creatives/2026-10-10/p1–p3): echte Studio-Szenen (Higgsfield) + klare Produkterklärung + Angebot.
// Szenenbilder: social/instagram/spot/stills/*.jpg. Texte für Meta in beitraege.js (WERBEMITTEL).
const WORT = "../../assets/wortmarke.png";
const STERN = "*Ratenzahlung über externe Anbieter wie Klarna, nach deren Prüfung. Tattoofin ist kein Kreditgeber. Achtung! Kreditaufnahme kostet Geld.";
const ORDNER = "creatives/2026-10-10";
const groesse = (f, [s, sq, st]) => (f === "s" ? s : f === "sq" ? sq : st) / 10 + "em";

const MOTIVE = {
  p1: { foto: "k1", pos: ["50% 20%", "50% 22%", "50% 30%"], stern: true, build: (f) => `
    <div class="sp"></div>
    <h1 class="h" style="font-size:${groesse(f, [96, 80, 108])}">Zahlungslinks, <span class="y">Raten*</span><br>&amp; Anzahlungen<br>fürs Tattoo-Studio.</h1>
    <div class="chips"><span>✓ Link per WhatsApp in 10 Sek.</span><span>✓ Geld automatisch aufs Konto</span><span>✓ Wir richten alles ein</span></div>` },
  p2: { foto: "s3", pos: ["50% 18%", "50% 20%", "50% 26%"], stern: false, phone: true, build: (f) => `
    <div class="sp"></div>
    <h1 class="h" style="font-size:${groesse(f, [94, 78, 104])}">Deine Kundin zahlt<br>per Link. <span class="y">Du bekommst<br>dein Geld automatisch.</span></h1>
    <p class="sub">Karte, Apple Pay oder Google Pay. Kein Bargeld, kein Hinterherlaufen.</p>` },
  p3: { foto: "s2", pos: ["60% 22%", "60% 22%", "60% 30%"], stern: true, build: (f) => `
    <div class="sp"></div>
    <h1 class="h" style="font-size:${groesse(f, [112, 92, 124])}">2.000 € auf einmal?<br><span class="y">Muss sie nicht.</span></h1>
    <p class="sub">Mit Tattoofin zahlt sie in Raten*, du bekommst dein Geld auf einmal.</p>` },
};

for (const [id, m] of Object.entries(MOTIVE)) {
  [["s", "feed", 0], ["sq", "square", 1], ["st", "story", 2]].forEach(([f, datei, k]) => {
    const d = document.createElement("div");
    d.className = `frame pr ${f}`;
    d.dataset.out = `${ORDNER}/${id}/${datei}.jpg`;
    const phone = m.phone && k < 2 ? `<div class="mini" style="width:${[330, 270, 380][k]}px;height:${[420, 340, 540][k]}px;right:${[60, 56, 60][k]}px;top:${[150, 110, 300][k]}px;transform:rotate(4deg)"><div class="scr">
        <p style="font:800 20px 'DM Sans'">Ink Studio · Sleeve</p><p class="lg" style="font-size:58px;margin:6px 0 16px">1.800 €</p>
        <div class="opt on">Karte <span>›</span></div><div class="opt">Apple Pay <span>›</span></div><div class="opt">Google Pay <span>›</span></div></div></div>` : "";
    d.innerHTML = `<img class="foto" src="spot/stills/${m.foto}.jpg" style="object-position:${m.pos[k]}"><div class="grad"></div>${phone}
      <div class="in"><div class="kopf"><span class="stk">Für Tattoo-Studios</span><img src="${WORT}"></div>
      ${m.build(f)}
      <div class="offer"><div><b>0 € Einrichtung</b><small>10 % pro Zahlung, alles inklusive</small></div><span class="btn">Jetzt starten</span></div>
      ${m.stern ? `<p class="fn">${STERN}</p>` : ""}</div>`;
    document.body.appendChild(d);
  });
}
</script>
</body></html>
