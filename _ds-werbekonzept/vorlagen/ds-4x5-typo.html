<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS 4:5 Raster C – Typo-Plakat</title>
<!-- Raster C "Text als Motiv" (Vorbild Oatly, Plakat): eine Fläche, eine Schrift, eine Aussage, Text füllt 60 bis 80 % der Fläche.
     Kein Foto dazu. Fläche = Grund ODER Akzent (Aktions-Motiv, dann nur Tinte darauf, Kontrast prüfen). Auch Ersatzweg ohne echtes Material. -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Vollfläche, schmal" aus ds.css */
:root { --grund:#FFD60A; --flaeche:#F7F4EC; --tinte:#111111; --gedaempft:#4A4536; --akzent:#111111; --auf-foto:#F7F4EC;
        --hf:"Archivo",sans-serif; --hw:800; --hbreite:68%; --hls:-0.01em; --hlh:.9; --bf:"Archivo",sans-serif; --korn:.04; }
/* RASTER C – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:168px; --klein:30px; }
.zeile.schmal { font-size:250px; }   /* Klasse .schmal bei schmaler Schrift (--hbreite unter 80 %): 210 bis 250 px, sonst füllt sie keine 60 % */
.zeile { left:80px; top:80px; width:920px; }   /* 160–190 px, max. 5 Zeilen, Unterkante <= y 1150 */
.ds.voll { background:var(--akzent); }
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--tinte); font-weight:600; }
.logo { bottom:80px; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <div class="zeile schmal">Ein Satz, so groß wie ein Plakat.</div>
  <div class="klein marke">Marke · Ort</div>
  <div class="korn"></div>
</div></body></html>
