<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS 4:5 Raster D – Split</title>
<!-- Raster D "Split": Foto oben 60 % (y 0–810, randlos), Markenfläche unten, Zeile auf der Fläche, Absender links unten.
     Für Fotos ohne ruhige Zone. Fläche = --flaeche oder --grund, nie Verlauf zwischen Foto und Fläche (harte Kante). -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Dunkel, Serif" aus ds.css */
:root { --grund:#13201B; --flaeche:#1C3129; --tinte:#EDE6D6; --gedaempft:#A9B0A6; --akzent:#C2A15A; --auf-foto:#EDE6D6;
        --hf:"Newsreader",serif; --hw:400; --hls:-0.015em; --hlh:1.0; --bf:"Schibsted Grotesk",sans-serif; --korn:.05; }
/* RASTER D – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:92px; --klein:28px; }
.foto { left:0; top:0; width:1080px; height:810px; }
.zeile { left:80px; top:870px; width:920px; }                    /* max. 3 Zeilen à 92 px, Unterkante <= 1146 */
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--tinte); font-weight:600; }
.logo { bottom:80px; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <img class="foto" src="platzhalter-foto.svg" alt="" style="object-position:50% 50%">
  <div class="zeile">Zwei bis sieben Wörter, die das Bild drehen.</div>
  <div class="klein marke">Marke · Ort</div>
  <div class="korn"></div>
</div></body></html>
