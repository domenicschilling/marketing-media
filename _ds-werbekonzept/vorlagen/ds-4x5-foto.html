<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS 4:5 Raster B – Foto vollflächig</title>
<!-- Raster B "Foto vollflächig": Foto füllt alles, Zeile im ruhigsten Drittel (oben ODER unten), Absender links unten.
     Kein Verlauf, kein Kasten hinter dem Text: ruhige Fläche über den Ausschnitt (object-position) finden.
     Findet sich keine ruhige Fläche: Raster A oder D nehmen. Klasse .unten an .zeile = Zeile unten (Oberkante y 900). -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Dunkel, Serif" (Zeile hell auf Foto) aus ds.css */
:root { --grund:#13201B; --flaeche:#1C3129; --tinte:#EDE6D6; --gedaempft:#A9B0A6; --akzent:#C2A15A; --auf-foto:#EDE6D6;
        --hf:"Newsreader",serif; --hw:400; --hls:-0.015em; --hlh:1.0; --bf:"Schibsted Grotesk",sans-serif; --korn:.05; }
/* RASTER B – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:110px; --klein:30px; }
.foto { inset:0; width:100%; height:100%; }
.zeile { left:80px; top:80px; width:880px; color:var(--auf-foto); }  /* oberes Drittel: y 80 bis max. 450 */
.zeile.unten { top:auto; bottom:172px; }                         /* unteres Drittel: Unterkante y 1178 */
.ds .zeile.dunkel, .ds .marke.dunkel { color:var(--auf-foto-dunkel); }
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--auf-foto); font-weight:600; }   /* .ds davor: schlägt .ds .klein (gedämpft wäre auf Foto zu schwach) */
.logo { bottom:80px; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <img class="foto" src="platzhalter-foto.svg" alt="" style="object-position:50% 50%">
  <div class="zeile">Zwei bis sieben Wörter.</div>
  <div class="klein marke">Marke · Ort</div>
  <div class="korn"></div>
</div></body></html>
