<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS Karussell-Folie 4:5</title>
<!-- Karussell-Folie 1080 x 1350. Gleiche Rasterposition auf JEDER Folie: Seitenzahl oben links, Überschrift ab y 150,
     Fließtext darunter, optional ein Bild/Screenshot im unteren Block (.bild), Absender links unten.
     Größen: Überschrift 100 px, Fließtext 38 px (Verhältnis 2,6 : 1; für Karussells gilt 2,5 : 1 statt 3 : 1), nie unter 36 px.
     Folie 1 = Hook: nur .titel (max. 10 Wörter) + Bild, rechts angeschnitten (.bild.anschnitt) als Wisch-Hinweis statt Pfeil. -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Vollfläche, schmal" aus ds.css */
:root { --grund:#FFD60A; --flaeche:#F7F4EC; --tinte:#111111; --gedaempft:#4A4536; --akzent:#111111; --auf-foto:#F7F4EC;
        --hf:"Archivo",sans-serif; --hw:800; --hbreite:68%; --hls:-0.01em; --hlh:.9; --bf:"Archivo",sans-serif; --korn:.04; }
/* RASTER KARUSSELL – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:100px; --klein:28px; }
.nr { position:absolute; left:80px; top:80px; font-size:var(--klein); color:var(--gedaempft); font-variant-numeric:tabular-nums; }
.titel { position:absolute; left:80px; top:150px; width:920px; font-family:var(--hf); font-weight:var(--hw); font-stretch:var(--hbreite); font-size:var(--h1); line-height:var(--hlh); letter-spacing:var(--hls); text-wrap:balance; }
.text { position:absolute; left:80px; width:880px; font-size:38px; line-height:1.25; }
.bild { position:absolute; left:80px; top:700px; width:920px; height:520px; object-fit:cover; object-position:50% 0; }
.bild.anschnitt { width:1080px; }                                   /* läuft rechts aus dem Bild: Wisch-Hinweis */
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--tinte); font-weight:600; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <div class="nr" data-gehoert="titel">1/6</div>
  <div class="titel">Hook in höchstens zehn Wörtern.</div>
  <img class="bild anschnitt" src="platzhalter-foto.svg" alt="">
  <div class="klein marke">Marke</div>
  <div class="korn"></div>
</div></body></html>
