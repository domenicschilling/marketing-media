<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS 4:5 Raster A – Rahmen</title>
<!-- Raster A "Rahmen" (Vorbild Apple Shot on iPhone): Foto im Off-White-Rahmen, Zeile darunter, Absender an derselben linken Kante.
     Für: echtes Ergebnisfoto mit wenig ruhiger Fläche, kleine oder mittlere Auflösung (ab ca. 900 px Breite).
     Kopieren nach content/<marke>/ds-<datum>/, nur MARKE-Block, Foto, Zeile und Absender ändern. Koordinaten: 02-bilder.md, Raster-Bibliothek. -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Hell, Grotesk" aus ds.css */
:root { --grund:#F1F1EC; --flaeche:#E2E3DD; --tinte:#121417; --gedaempft:#575C63; --akzent:#C42B17; --auf-foto:#F1F1EC;
        --hf:"Schibsted Grotesk",sans-serif; --hw:800; --hls:-0.025em; --hlh:.98; --bf:"Schibsted Grotesk",sans-serif; --korn:.05; }
/* RASTER A – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:88px; --klein:28px; }
.foto { left:80px; top:80px; width:920px; height:860px; }
.zeile { left:80px; top:1000px; width:920px; }           /* max. 2 Zeilen à 88 px, Unterkante <= 1186 */
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--tinte); font-weight:600; }
.logo { bottom:80px; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <img class="foto" src="platzhalter-foto.svg" alt="" style="object-position:50% 50%">
  <div class="zeile">Sieben Wörter, die das Bild drehen.</div>
  <div class="klein marke">Marke · Ort</div>
  <div class="korn"></div>
</div></body></html>
