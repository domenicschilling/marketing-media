<!doctype html><html lang="de"><head><meta charset="utf-8"><title>DS 4:5 Raster E – Zahl als Motiv</title>
<!-- Raster E "Detail mit großer Zahl": eine belegte Zahl groß (240 px) oben links, Zeile darunter, Quelle in der Absenderzeile.
     Nur echte, belegte Zahlen (Master-Prompt). Optional Foto/Screenshot als Fläche rechts unten (.detail), dann max. 3 Elemente:
     Zahl+Zeile, Detail, Absender+Quelle. -->
<link rel="stylesheet" href="../../_ds-werbekonzept/vorlagen/ds.css">
<style>
/* MARKE – nur hier ändern (Werte aus Kit/brand.json oder Markenkarte in 05). Platzhalter: Startwelt "Hell, Grotesk" aus ds.css */
:root { --grund:#F1F1EC; --flaeche:#E2E3DD; --tinte:#121417; --gedaempft:#575C63; --akzent:#C42B17; --auf-foto:#F1F1EC;
        --hf:"Schibsted Grotesk",sans-serif; --hw:800; --hls:-0.025em; --hlh:.98; --bf:"Schibsted Grotesk",sans-serif; --korn:.05; }
/* RASTER E – nicht ändern */
:root { --w:1080px; --h:1350px; --h1:72px; --klein:28px; }
.zahl { position:absolute; left:72px; top:40px; font-family:var(--hf); font-weight:var(--hw); font-stretch:var(--hbreite); font-size:240px; line-height:1; letter-spacing:-.03em; color:var(--akzent); font-variant-numeric:tabular-nums; }
.zeile { left:80px; top:330px; width:760px; }                    /* max. 3 Zeilen à 72 px */
.detail { position:absolute; left:440px; top:640px; width:560px; height:550px; object-fit:cover; object-position:50% 0; }
.ds .marke { left:80px; bottom:80px; font-size:var(--klein); color:var(--tinte); font-weight:600; }
.marke span { font-weight:400; color:var(--gedaempft); }
.logo { bottom:80px; }
</style></head><body>
<div class="ds" data-w="1080" data-h="1350">
  <div class="zahl">17</div>
  <div class="zeile" data-gehoert="zahl">Eine Zeile, die sagt, warum die Zahl zählt.</div>
  <img class="detail foto" src="platzhalter-foto.svg" alt="">
  <div class="klein marke">Marke <span>· Quelle: eigene Messung, Datum</span></div>
  <div class="korn"></div>
</div></body></html>
