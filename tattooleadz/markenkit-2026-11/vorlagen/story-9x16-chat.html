<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Story 9:16 Chat</title>
<link rel="stylesheet" href="../assets/kit.css"><link rel="stylesheet" href="_basis.css">
<style>:root{--w:1080px;--h:1920px}
.top{position:absolute;left:72px;top:250px}.top img{width:150px}
h1{position:absolute;left:72px;right:72px;top:440px;font-size:104px}
.chat{position:absolute;left:72px;right:72px;top:800px;padding:36px;border-radius:44px;gap:20px;border:1px solid rgba(245,242,234,.08)}
.chead{display:flex;align-items:center;gap:20px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.av{width:76px;height:76px;border-radius:50%;background:var(--amber-500);color:var(--ink-950);display:grid;place-items:center;font:700 34px/1 var(--hf)}
.chead b{font:600 34px/1.1 var(--bf);color:#E9EDEF;display:block}.chead small{font:500 24px/1 var(--bf);color:#8696A0}
.bub{font-size:36px;line-height:1.35;padding:22px 28px;border-radius:30px;border-top-left-radius:8px;max-width:84%}
.bub.out{border-top-left-radius:30px;border-top-right-radius:8px}
.bub small{font-size:22px;margin-top:6px;color:#9FB0B8}.bub.out small{color:#CFE5DF}
.tag{position:absolute;right:72px;top:262px;font:600 26px/1 var(--bf);color:var(--muted);border:1px solid var(--surface-line);border-radius:9999px;padding:12px 22px}
.cta{position:absolute;left:72px;bottom:340px}
</style></head><body>
<div class="c"><div class="glow"></div>
  <div class="top"><img class="logo" src="../assets/logo-gold.png" alt="TattooLeadz"></div>
  <span class="tag">Beispiel-Chat</span>
  <h1 class="h">Antwort in Sekunden. <span class="gold">Auch um 23 Uhr.</span></h1>
  <div class="chat">
    <div class="chead"><div class="av">DI</div><div><b>Demo Ink</b><small>online</small></div></div>
    <div class="bub">Hey Lena, danke für deine Anfrage bei Demo Ink! Hast du schon ein Motivbild?<small>14:02</small></div>
    <div class="bub out">Ja, so in der Art. Passt mir eher am Wochenende.<small>14:03</small></div>
  </div>
  <span class="pill-cta cta">Link im Profil <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</div></body></html>
