<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Post 4:5 Kennst du das</title>
<link rel="stylesheet" href="../assets/kit.css"><link rel="stylesheet" href="_basis.css">
<style>:root{--w:1080px;--h:1350px}
.top{position:absolute;left:72px;top:64px;right:72px;display:flex;justify-content:space-between;align-items:center}.top img{width:130px}
.handle{font:600 28px/1 var(--bf);color:var(--muted)}
.wrap{position:absolute;left:72px;right:72px;top:230px;bottom:64px;display:flex;flex-direction:column}
h1{font-size:120px;margin-bottom:40px}
.cards{display:flex;flex-direction:column;gap:20px}
.card{padding:26px 40px;border-radius:28px;display:flex;flex-direction:column;gap:10px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font:500 24px/1 var(--bf);color:#8F897E}
.card .dot{width:16px;height:16px}
.card p{font:500 38px/1.25 var(--bf);color:var(--cream-100)}
.close{margin-top:auto;font:700 56px/1.05 var(--hf);letter-spacing:-.02em}
</style></head><body>
<div class="c"><div class="glow"></div>
  <div class="top"><img class="logo" src="../assets/logo-gold.png" alt="TattooLeadz"><span class="handle">@tattooleadz</span></div>
  <div class="wrap">
    <h1 class="h">Kennst du das?</h1>
    <div class="cards">
      <div class="card"><div class="meta"><span class="dot"></span><span>23:14</span></div><p>Nachts um 23 Uhr noch DMs beantworten.</p></div>
      <div class="card"><div class="meta"><span class="dot grey"></span><span>08:42</span></div><p>„Was kostet ein Tattoo?“ – zum hundertsten Mal.</p></div>
      <div class="card"><div class="meta"><span class="dot grey"></span><span>16:30</span></div><p>Leere Slots, obwohl du eigentlich ausgebucht sein könntest.</p></div>
    </div>
    <p class="close">Du bist Künstler – <span class="gold">nicht Sekretär.</span></p>
  </div>
</div></body></html>
