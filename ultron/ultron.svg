<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ultron">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#2a0709"/>
      <stop offset=".45" stop-color="#0c0f14"/>
      <stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="metall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7b4c2"/>
      <stop offset=".3" stop-color="#4b5765"/>
      <stop offset=".62" stop-color="#191f27"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="platte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c343f"/>
      <stop offset="1" stop-color="#0d1116"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c4d2" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3a4450" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="auge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1a1a"/>
      <stop offset=".5" stop-color="#ffd6cc"/>
      <stop offset="1" stop-color="#ff1a1a"/>
    </linearGradient>
    <filter id="glut" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="naht" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2020" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff2020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="250" rx="210" ry="200" fill="url(#halo)"/>

  <!-- Hals / Kabel -->
  <g fill="#0b0e12" stroke="#2a323c" stroke-width="2">
    <path d="M200 400 L214 480 L240 480 L232 404 Z"/>
    <path d="M312 400 L298 480 L272 480 L280 404 Z"/>
    <path d="M240 420 L246 492 L266 492 L272 420 Z"/>
  </g>
  <path d="M222 430 L228 478 M290 430 L284 478" stroke="#ff2a2a" stroke-width="2" opacity=".7" filter="url(#naht)"/>

  <!-- Helm -->
  <path id="kopf" d="M256 58 C338 58 392 112 396 198 L390 286 L352 356 L306 410 L256 432 L206 410 L160 356 L122 286 L116 198 C120 112 174 58 256 58 Z" fill="url(#metall)"/>
  <path d="M256 58 C338 58 392 112 396 198 L390 286 L352 356 L306 410 L256 432 L206 410 L160 356 L122 286 L116 198 C120 112 174 58 256 58 Z" fill="none" stroke="url(#rand)" stroke-width="3"/>

  <!-- Mittelgrat + Stirnplatten -->
  <path d="M256 60 L268 120 L262 210 L250 210 L244 120 Z" fill="#1a2028" stroke="#56616e" stroke-width="1.2"/>
  <path d="M150 150 C180 112 220 98 244 120 L250 210 L176 214 C160 196 150 176 150 150 Z" fill="url(#platte)" opacity=".85"/>
  <path d="M362 150 C332 112 292 98 268 120 L262 210 L336 214 C352 196 362 176 362 150 Z" fill="url(#platte)" opacity=".85"/>

  <!-- rote Nähte (Energieadern) -->
  <g stroke="#ff2a2a" stroke-width="2.6" fill="none" stroke-linecap="round" filter="url(#naht)">
    <path d="M256 66 L262 116 L256 204"/>
    <path d="M262 116 L300 104 L318 128"/>
    <path d="M250 140 L210 132 L188 152"/>
    <path d="M300 104 L334 96"/>
    <path d="M210 132 L196 108"/>
    <path d="M256 170 L290 176 L304 196"/>
  </g>

  <!-- Brauen -->
  <path d="M138 214 L246 226 L250 244 L150 236 Z" fill="#0a0d11" stroke="#4a5562" stroke-width="1.2"/>
  <path d="M374 214 L266 226 L262 244 L362 236 Z" fill="#0a0d11" stroke="#4a5562" stroke-width="1.2"/>

  <!-- Augen -->
  <g class="augen" filter="url(#glut)">
    <path d="M160 244 L238 254 L232 270 L170 262 Z" fill="url(#auge)"/>
    <path d="M352 244 L274 254 L280 270 L342 262 Z" fill="url(#auge)"/>
  </g>

  <!-- Wangen -->
  <g fill="none" stroke="#0a0d11" stroke-width="3">
    <path d="M134 290 L196 296 L226 352"/>
    <path d="M378 290 L316 296 L286 352"/>
  </g>
  <g fill="none" stroke="#6b7785" stroke-width="1" opacity=".55">
    <path d="M136 286 L198 292 L228 348"/>
    <path d="M376 286 L314 292 L284 348"/>
  </g>

  <!-- Mundgitter -->
  <path d="M214 318 L298 318 L286 392 L256 408 L226 392 Z" fill="#07090c" stroke="#3b4450" stroke-width="1.5"/>
  <g stroke="#ff2a2a" stroke-width="3" opacity=".75" filter="url(#naht)">
    <path d="M232 330 L236 384"/><path d="M248 330 L250 394"/><path d="M264 330 L262 394"/><path d="M280 330 L276 384"/>
  </g>

  <!-- Glanzkante -->
  <path d="M150 120 C176 88 210 72 248 68" stroke="#dfe7f0" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
</svg>
