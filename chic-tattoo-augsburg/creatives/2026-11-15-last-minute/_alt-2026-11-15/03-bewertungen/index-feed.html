<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>03 Bewertungen – Feed</title>
<link rel="stylesheet" href="../_system/base.css">
<style>
/* Idee: Blick + Beweis. Spartaner- und Löwenauge schauen dich an, das Foto taucht nach unten ins Schwarz,
   die „5,0“ steigt als Plakat-Zahl aus dem Bild auf. Schwarzweiß, weil Black & Grey. */
.photo{left:0;top:0;width:1080px;height:930px;--fade:300px}
.logo{position:absolute;left:56px;top:56px;width:112px;height:112px;z-index:5;box-shadow:0 0 0 3px var(--ink)}
.score{position:absolute;left:46px;top:776px;font-size:392px;line-height:.74;letter-spacing:-.03em;z-index:3}
.meta{position:absolute;left:502px;top:884px;width:520px;z-index:3}
.stars{display:flex;gap:8px;margin-bottom:24px}
.stars svg{width:58px;height:58px;fill:var(--red)}
.meta .src{font-size:66px;line-height:.9;color:var(--bone);font-stretch:68%;word-spacing:.1em}
.meta .src em{font-style:normal;color:var(--red2)}
.meta .stand{margin-top:18px;font-size:22px;color:var(--mute)}
.band{position:absolute;left:0;right:0;top:1166px;height:112px;background:var(--red);display:flex;align-items:center;justify-content:space-between;padding:0 var(--g);z-index:4}
.band b{font-size:86px;color:#fff;line-height:1;padding-top:7px;word-spacing:.07em}
.band span{font-size:21px;color:#fff;text-align:right;line-height:1.15}
.foot{position:absolute;left:var(--g);right:var(--g);top:1302px;display:flex;justify-content:space-between;font-size:20px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sh" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 -.3 0 -.3 2.2 -.3 0 -.3 0" preserveAlpha="true"/></filter>
  <symbol id="st" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></symbol>
</svg>
<div class="c feed">
  <div class="ph photo fade-b" data-src="../_system/img/05-loewe-spartaner.png" data-crop="190,232,1110,1024" data-filter="url(#sh) grayscale(1) contrast(1.3) brightness(.9)"></div>
  <div class="logo"><img src="../_system/img/logo-480.webp" alt=""></div>

  <p class="d score tnum">5,0</p>
  <div class="meta">
    <div class="stars" aria-label="5 von 5 Sternen">
      <svg><use href="#st"/></svg><svg><use href="#st"/></svg><svg><use href="#st"/></svg><svg><use href="#st"/></svg><svg><use href="#st"/></svg>
    </div>
    <p class="d72 src"><em>372</em> Bewertungen<br>auf Google</p>
    <p class="txt stand">Stand 15.11.2026</p>
  </div>

  <div class="band"><b class="d">Freie Termine bis 30.11.</b><span class="lab">Last Minute<br>November</span></div>
  <p class="sender foot"><span><b>Chic Tattoo &amp; Piercing</b></span><span>Augsburg-Oberhausen</span></p>
  <div class="grain"></div>
</div>
<script src="../_system/crop.js"></script>
</body></html>
