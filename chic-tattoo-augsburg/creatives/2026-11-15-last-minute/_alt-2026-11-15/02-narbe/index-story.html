<link rel="stylesheet" href="../_system/base.css">
<style>
/* Story: Nachher groß rechtsbündig, Vorher als eingeklebtes Beweisfoto mit Bein-Rahmen unten links (wie im Original-Reel).

.nach{left:229px;top:90px;width:851px;height:1000px}

.tag.n{left:406px;top:1090px;transform:translateY(-100%);background:var(--red);color:#fff}

.hl{position:absolute;left:var(--g);top:1222px;font-size:136px}
.hl span{display:block}
.offer{position:absolute;left:var(--g);top:1474px;font-size:24px;color:var(--bone)}
.offer em{font-style:normal;color:var(--red2)}
.foot{position:absolute;left:420px;right:var(--g);top:1112px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:21px;text-align:right}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sh" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 -0.22 0 -0.22 1.88 -0.22 0 -0.22 0" preserveAlpha="true"/></filter></svg>
<div class="c story">
